          <div class="stats" id="pd-cards" style="margin-bottom:0"></div>
        </div>
        <div class="grid cols-2">
          <div class="card"><h3>Productivity Trend</h3><div class="chart-box"><canvas id="pd-trend"></canvas></div></div>
          <div class="card"><h3>Top 10 Employee Performance</h3><div class="chart-box"><canvas id="pd-emp"></canvas></div></div>
          <div class="card"><h3>Task Type Distribution</h3><div class="chart-box"><canvas id="pd-task"></canvas></div></div>
          <div class="card"><h3>Productivity by Time Interval</h3><div class="chart-box"><canvas id="pd-hour"></canvas></div></div>
        </div>
        <div class="card"><h3>Quick Statistics</h3><pre class="report" id="pd-stats"></pre></div>
      </div>

      <div class="tab-panel" data-tab="job">
        <div class="card">
          <div class="toolbar">
            <label><b>Job Number:</b></label>
            <select id="jp-job"><option value="">All jobs - overview</option></select>
            <label><b>Period:</b></label>
            <select id="jp-period">${['Today', 'This Week', 'This Month', 'This Year', 'All Time'].map(p => `<option ${p === 'All Time' ? 'selected' : ''}>${p}</option>`).join('')}</select>
            <button class="btn ghost sm" id="jp-export">⬇️ Export</button>
            <span class="count" id="jp-note"></span>
          </div>
          <div class="stats" id="jp-cards" style="margin-bottom:0"></div>
        </div>
        <div class="card" id="jp-overview">
          <h3>📁 All Jobs <span class="right">click a job to see its operation progress</span></h3>
          <div id="jp-all"></div>
        </div>
        <div id="jp-detail" class="hidden">
          <div class="grid cols-2">
            <div class="card"><h3>📊 Pieces per Operation <span class="right">job file order</span></h3><div class="chart-box tall"><canvas id="jp-c-ops"></canvas></div></div>
            <div class="card"><h3>📈 Daily Output</h3><div class="chart-box tall"><canvas id="jp-c-daily"></canvas></div></div>
          </div>
          <div class="card"><h3>⚙️ Operation Progress <span class="right" id="jp-ops-note"></span></h3><div id="jp-ops"></div></div>
          <div class="card"><h3>📦 Line Status <span class="right">Line Balance = Line Input − Line Output (✎ = edited by admin)</span></h3>
            <div class="grid cols-2">
              <div class="chart-box"><canvas id="jp-c-line"></canvas></div>
              <div><div id="jp-lines"></div>
                <div class="form-actions"><button class="btn danger sm" id="jp-line-del">🗑️ Delete selected line entry</button></div></div>
            </div>
          </div>
          <div class="card"><h3>👥 Employees on this Job</h3><div id="jp-emps"></div></div>
        </div>
      </div>

      <div class="tab-panel" data-tab="rec">
        <div class="card">
          <div class="toolbar">
            <label>Employee:</label><input id="rf-emp" placeholder="ID or name">
            <label>Job:</label><select id="rf-job"><option value="">All jobs</option></select>
            <label>Date:</label><input type="date" id="rf-date">
            <button class="btn primary sm" id="rf-apply">Apply Filter</button>
            <button class="btn ghost sm" id="rf-clear">Clear</button>
            <span class="count" id="rf-count"></span>
          </div>
          <div id="rec-table"></div>
          <div class="form-actions">
            <button class="btn success" id="rec-export">⬇️ Export Records</button>
            <button class="btn danger" id="rec-del">🗑️ Delete Record</button>
          </div>
        </div>
      </div>

      <div class="tab-panel" data-tab="rep">
        <div class="grid cols-2">
          <div class="card"><h3>Quick Attendance Statistics</h3><pre class="report" id="rep-stats"></pre></div>
          <div class="card"><h3>Report Generation</h3>
            <div style="display:flex;flex-direction:column;gap:10px;max-width:280px">
              <button class="btn teal" id="rep-update">Update Statistics</button>
              <button class="btn success" id="rep-daily">Daily Report</button>
              <button class="btn primary" id="rep-monthly">Monthly Report</button>
              <button class="btn warning" id="rep-summary">Productivity Summary</button>
              <button class="btn danger" id="rep-export">Export Productivity</button>
            </div>
          </div>
        </div>
      </div>`;

    let data = { records: [], attendance: [], employees: [] };
    let hw = {};
    tabs(el, t => { if (t === 'dash') drawDashboard(); if (t === 'job') drawJobs(); });

    /* ---------------- attendance ---------------- */
    const attTable = new DataTable($('#att-table'), {
      rowKey: 'id',
      columns: [
        { key: 'id', label: 'Record ID' }, { key: 'uid', label: 'UID' }, { key: 'name', label: 'Employee Name' },
        { key: 'date', label: 'Date', value: r => dmyToIso(r.date) || r.date, render: r => esc(r.date) },
        { key: 'time_in', label: 'Time In' }, { key: 'time_out', label: 'Time Out', render: r => r.time_out ? esc(r.time_out) : '<span class="badge blue">In office</span>' },
        { key: 'work_hours', label: 'Work Hours' }, { key: 'ot_hours', label: 'OT Hours' },
      ],
    });
    searchBar($('#att-search'), attTable, { options: [['*', 'All fields'], ['name', 'Name'], ['uid', 'UID'], ['date', 'Date (dd/mm/yyyy)']] });

    $('#att-start').onclick = async () => { await act(api('POST', '/api/hardware/attendance/start')); loadHw(); };
    $('#att-stop').onclick = async () => { await act(api('POST', '/api/hardware/attendance/stop')); loadHw(); };
    $('#att-del').onclick = async () => {
      const r = attTable.selected;
      if (!r) return toast('Please select a record to delete.', 'error');
      if (!(await confirmBox(`Delete attendance of ${r.name} on ${r.date}?`, 'Delete'))) return;
      if (await act(api('DELETE', `/api/attendance/${encodeURIComponent(r.id)}`))) load();
    };
    $('#att-export').onclick = () => download(`attendance_${today()}.csv`, toCSV(attTable.view, attTable.columns));

    const dailyReport = () => {
      const t = lkDate();
      const recs = data.attendance.filter(a => a.date === t);
      if (!recs.length) return toast(`No attendance records for today (${t})`);
      const out = recs.filter(r => r.time_out).length;
      let s = `DAILY ATTENDANCE REPORT - ${t}\n${'='.repeat(60)}\n\nTotal Employees: ${recs.length}\nChecked Out: ${out}\nStill In Office: ${recs.length - out}\n\n${'-'.repeat(60)}\n`;
      recs.forEach(r => {
        s += `Employee: ${r.name || 'Unknown'}\nUID: ${r.uid || 'N/A'}\nTime In: ${r.time_in || 'N/A'}\nTime Out: ${r.time_out || 'Still in office'}\n`;
        if (r.work_hours) s += `Work Hours: ${r.work_hours}\n`;
        if (r.ot_hours && r.ot_hours !== '0h 0m') s += `OT Hours: ${r.ot_hours}\n`;
        s += `${'-'.repeat(30)}\n`;
      });
      showReport('Daily Attendance Report', s);
    };
    $('#att-daily').onclick = dailyReport;

    /* ---------------- employee registration ---------------- */
    const empTable = new DataTable($('#emp-table'), {
      rowKey: 'id',
      columns: [{ key: 'id', label: 'Employee ID' }, { key: 'rfid', label: 'RFID UID' }, { key: 'name', label: 'Name',
        render: r => r.name === 'Unknown' ? '<span class="badge red">Unknown</span>' : esc(r.name) },
        { key: 'usertype', label: 'User Type' }, { key: 'registration_date', label: 'Registration Date' }],
      onSelect: r => { $('#emp-newname').value = r.name === 'Unknown' ? '' : r.name; $('#emp-newname').focus(); },
    });
    $('#emp-rename').onclick = async () => {
      const r = empTable.selected, name = $('#emp-newname').value.trim();
      if (!r) return toast('Please select an employee to update.', 'error');
      if (!name) return toast('Please enter a name for the employee.', 'error');
      if (!(await confirmBox(`Update employee name from "${r.name}" to "${name}"?`, 'Update', 'primary'))) return;
      if (await act(api('PUT', `/api/employees/${encodeURIComponent(r.id)}/name`, { name }))) { $('#emp-newname').value = ''; load(); }
    };

    /* ---------------- productivity dashboard ---------------- */
    const periodFilter = (recs, p = $('#pd-period').value) => {
      const now = new Date(), t = today();
      let from = null;
      if (p === 'Today') return recs.filter(r => r.date === t);
      if (p === 'This Week') { const d = new Date(now); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); from = isoDate(d); }
      if (p === 'This Month') from = t.slice(0, 8) + '01';
      if (p === 'This Year') from = t.slice(0, 5) + '01-01';
      return from ? recs.filter(r => r.date >= from) : recs;
    };
    const sumBy = (recs, key) => {
      const o = {};
      recs.forEach(r => { o[r[key]] = (o[r[key]] || 0) + r.pieces; });
      return o;
    };

    function drawDashboard() {
      const recs = periodFilter(data.records.filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date)));
      const pieces = recs.reduce((a, r) => a + r.pieces, 0);
      const lineRecs = periodFilter((data.line_records || []).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date)));
      const lineIn = recs.reduce((a, r) => a + r.line_in, 0) + lineRecs.reduce((a, r) => a + r.line_input, 0);
      const lineBalExtra = lineRecs.reduce((a, r) => a + r.line_balance - (r.line_input - r.line_output), 0);   // admin edits
      const lineOut = recs.reduce((a, r) => a + r.line_out, 0) + lineRecs.reduce((a, r) => a + r.line_output, 0);
      const byEmp = Object.entries(sumBy(recs, 'employee_name')).sort((a, b) => b[1] - a[1]);
      const top = byEmp[0];
      $('#pd-cards').innerHTML = `
        <div class="stat" style="--accent:#3498DB"><div class="label">Total Pieces</div><div class="value">${fmtInt(pieces)}</div></div>
        <div class="stat" style="--accent:#16A085"><div class="label">Total Line Out</div><div class="value">${fmtInt(lineOut)}</div></div>
        <div class="stat" style="--accent:#F39C12"><div class="label">Top Performer</div><div class="value" style="font-size:16px">${top ? `${esc(top[0])}<br>${fmtInt(top[1])} pcs` : 'N/A'}</div></div>
        <div class="stat" style="--accent:#9B59B6"><div class="label">Tasks Completed</div><div class="value">${fmtInt(recs.length)}</div></div>`;

      const trend = sumBy(recs, 'date'), tk = Object.keys(trend).sort();
      const c1 = $('#pd-trend');
      if (!tk.length) emptyChart(c1, 'No data for this period'); else {
        showCanvas(c1);
        chart(c1, { type: 'line', data: { labels: tk, datasets: [{ label: 'Pieces', data: tk.map(k => trend[k]), borderColor: Theme.ink, backgroundColor: Theme.soft, fill: true, tension: .3 }] },
          options: { scales: { y: { beginAtZero: true } } } });
      }
      const c2 = $('#pd-emp'), top10 = byEmp.slice(0, 10);
      if (!top10.length) emptyChart(c2, 'No data for this period'); else {
        showCanvas(c2);
        chart(c2, { type: 'bar', data: { labels: top10.map(e => e[0]), datasets: [{ label: 'Pieces', data: top10.map(e => e[1]), backgroundColor: Theme.ink, borderRadius: 4 }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
      }
      const tasks = Object.entries(sumBy(recs, 'task_type')).sort((a, b) => b[1] - a[1]);
      const c3 = $('#pd-task');
      if (!tasks.length) emptyChart(c3, 'No data for this period'); else {
        showCanvas(c3);
        const big = tasks.filter(t => t[1] / pieces >= 0.03), other = tasks.filter(t => t[1] / pieces < 0.03).reduce((a, t) => a + t[1], 0);
        if (other) big.push(['Other', other]);
        chart(c3, { type: 'pie', data: { labels: big.map(t => t[0]), datasets: [{ data: big.map(t => t[1]), backgroundColor: PALETTE }] },
          options: { plugins: { legend: { position: 'right' } } } });
      }
      const hours = {}, order = {};
      recs.forEach(r => { const k = r.slot || `${String(r.hour).padStart(2, '0')}:00`; hours[k] = (hours[k] || 0) + r.pieces; order[k] = r.slot_order ?? r.hour * 60; });
      const hk = Object.keys(hours).sort((a, b) => order[a] - order[b]);
      const c4 = $('#pd-hour');
      if (!hk.length) emptyChart(c4, 'No data for this period'); else {
        showCanvas(c4);
        chart(c4, { type: 'line', data: { labels: hk, datasets: [{ label: 'Pieces', data: hk.map(h => hours[h]), borderColor: Theme.ink, backgroundColor: Theme.soft, fill: true, tension: .3 }] },
          options: { scales: { y: { beginAtZero: true } } } });
      }

      const bal = lineIn - lineOut + lineBalExtra;
      let s = `PRODUCTIVITY STATISTICS\nPeriod: ${$('#pd-period').value}\nGenerated: ${new Date().toLocaleString('en-GB')}\n${'='.repeat(50)}\n\n`;
      if (!recs.length) s += 'No productivity data available for this period.\n';
      else {
        s += `Total Records: ${fmtInt(recs.length)}\nTotal Pieces: ${fmtInt(pieces)}\nActive Employees: ${byEmp.length}\nTask Types: ${tasks.length}\n\n`;
        s += `LINE STATISTICS:\n${'-'.repeat(20)}\nTotal Line In: ${fmtInt(lineIn)}\nTotal Line Out: ${fmtInt(lineOut)}\nLine Balance: ${fmtInt(bal)}\n`;
        s += `Balance Status: ${bal > 0 ? 'Positive (More Input)' : bal < 0 ? 'Negative (More Output)' : 'Balanced'}\n\n`;
        s += `TOP 5 PERFORMERS:\n${'-'.repeat(20)}\n${byEmp.slice(0, 5).map((e, i) => `${i + 1}. ${e[0]}: ${fmtInt(e[1])} pieces`).join('\n')}\n\n`;
        s += `TASK DISTRIBUTION:\n${'-'.repeat(20)}\n${tasks.map(t => `${t[0]}: ${fmtInt(t[1])} (${(t[1] / pieces * 100).toFixed(1)}%)`).join('\n')}\n`;
      }
      $('#pd-stats').textContent = s;
    }
    $('#pd-period').onchange = drawDashboard;

    /* ---------------- records ---------------- */
    const recTable = new DataTable($('#rec-table'), {
      rowKey: 'path',
      columns: [
        { key: 'employee_id', label: 'Employee ID' }, { key: 'employee_name', label: 'Employee Name' }, { key: 'date', label: 'Date' },
        { key: 'job_number', label: 'Job No.', render: r => r.job_number ? esc(r.job_number) : '<span class="badge gray">-</span>' },
        { key: 'item_name', label: 'Item' },
        { key: 'slot', label: 'Hour / Interval', value: r => r.slot_order ?? r.hour * 60, render: r => esc(r.slot || `${String(r.hour).padStart(2, '0')}:00`) },
        { key: 'task_type', label: 'Task Type (Operation)' },
        { key: 'pieces', label: 'Pieces', num: true }, { key: 'line_in', label: 'Line In', num: true }, { key: 'line_out', label: 'Line Out', num: true },
        { key: 'recorded_at', label: 'Recorded At' }, { key: 'source', label: 'Source' },
      ],
    });
    recTable.onRender = v => { $('#rf-count').textContent = `${v.length} of ${recTable.rows.length} records`; };
    const applyRecFilter = () => {
      const e = $('#rf-emp').value.trim().toLowerCase(), d = $('#rf-date').value, j = $('#rf-job').value;
      recTable.setFilter(!e && !d && !j ? null : r => (!e || `${r.employee_id} ${r.employee_name}`.toLowerCase().includes(e))
        && (!d || r.date === d) && (!j || (j === NO_JOB ? !r.job_number : r.job_number === j)));
    };
    $('#rf-apply').onclick = applyRecFilter;
    $('#rf-job').onchange = applyRecFilter;
    $('#rf-clear').onclick = () => { $('#rf-emp').value = ''; $('#rf-date').value = ''; $('#rf-job').value = ''; recTable.setFilter(null); };
    $('#rec-del').onclick = async () => {
      const r = recTable.selected;
      if (!r) return toast('Please select a record to delete.', 'error');
      if (!(await confirmBox(`Are you sure you want to delete this record?\n\nEmployee: ${r.employee_name}\nDate: ${r.date}\nTime: ${r.slot || r.hour}\nTask: ${r.task_type}\nPieces: ${r.pieces}`, 'Delete'))) return;
      if (await act(api('DELETE', '/api/productivity/record', { path: r.path }))) load();
    };
    const exportRecords = () => download(`productivity_records_${today()}.csv`, toCSV(recTable.view.length ? recTable.view : data.records, recTable.columns.map(c =>
      c.key === 'slot' ? { label: 'Hour / Interval', value: r => r.slot || `${String(r.hour).padStart(2, '0')}:00` } : c)));
    $('#rec-export').onclick = exportRecords;

    /* ---------------- reports ---------------- */
    const quickStats = () => {
      const t = lkDate();
      const todays = data.attendance.filter(a => a.date === t);
      const out = todays.filter(a => a.time_out).length;
      const uniq = new Set(data.attendance.map(a => a.name).filter(Boolean));
      let s = `QUICK ATTENDANCE STATISTICS\nGenerated: ${new Date().toLocaleString('en-GB')}\n${'='.repeat(50)}\n\n`;
      s += `TODAY'S SUMMARY (${t}):\n  Total Employees Today: ${todays.length}\n  Checked Out: ${out}\n  Still In Office: ${todays.length - out}\n\n`;
      s += `OVERALL STATISTICS:\n  Total Attendance Records: ${data.attendance.length}\n  Registered Employees: ${uniq.size}\n\n`;
      if (todays.length) s += `TODAY'S EMPLOYEE LIST:\n${todays.map((a, i) => `  ${i + 1}. ${a.name || 'Unknown'} - ${a.time_out ? 'Out' : 'In Office'}`).join('\n')}\n`;
      $('#rep-stats').textContent = s;
    };
    $('#rep-update').onclick = () => { load().then(() => toast('Statistics updated', 'success')); };
    $('#rep-daily').onclick = dailyReport;
    $('#rep-monthly').onclick = () => {
      const now = new Date();
      const recs = data.attendance.filter(a => { const d = parseAnyDate(a.date); return d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
      if (!recs.length) return toast('No attendance records for this month');
      const by = {};
      recs.forEach(r => (by[r.name || 'Unknown'] ||= []).push(r));
      let s = `MONTHLY ATTENDANCE REPORT - ${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}\n${'='.repeat(60)}\n\n`;
      Object.entries(by).forEach(([name, rs]) => {
        s += `EMPLOYEE: ${name}\n${'-'.repeat(40)}\n`;
        let present = 0, work = 0, ot = 0;
        rs.sort((a, b) => (dmyToIso(a.date) || '').localeCompare(dmyToIso(b.date) || '')).forEach(r => {
          s += `Date: ${r.date}   In: ${r.time_in || 'N/A'}   Out: ${r.time_out || 'N/A'}   Work: ${r.work_hours || 'N/A'}   OT: ${r.ot_hours || 'N/A'}\n`;
          if (r.time_in && r.time_out) present++;
          work += parseHM(r.work_hours); ot += parseHM(r.ot_hours);
        });
        s += `\nTotal Days: ${rs.length}\nPresent Days: ${present}\nTotal Work Hours: ${work.toFixed(2)}h\nTotal OT Hours: ${ot.toFixed(2)}h\n${'='.repeat(60)}\n\n`;
      });
      showReport('Monthly Attendance Report', s);
    };
    $('#rep-summary').onclick = () => {
      if (!data.records.length) return toast('No productivity data available');
      const by = {};
      data.records.forEach(r => {
        const e = by[r.employee_id || r.employee_name] ||= { name: r.employee_name, pieces: 0, days: new Set(), tasks: new Set() };
        e.pieces += r.pieces; e.days.add(r.date); e.tasks.add(r.task_type);
      });
      let s = `EMPLOYEE PRODUCTIVITY SUMMARY\nGenerated: ${new Date().toLocaleString('en-GB')}\n${'='.repeat(80)}\n\n`;
      Object.entries(by).sort((a, b) => b[1].pieces - a[1].pieces).forEach(([id, e]) => {
        s += `Employee: ${e.name} (ID: ${id})\nTotal Pieces Completed: ${e.pieces}\nActive Days: ${e.days.size}\nAverage Pieces/Day: ${(e.pieces / Math.max(e.days.size, 1)).toFixed(1)}\nTask Types: ${[...e.tasks].join(', ')}\n${'-'.repeat(60)}\n`;
      });
      showReport('Employee Productivity Summary', s);
    };
    $('#rep-export').onclick = exportRecords;

    /* ---------------- hardware status ---------------- */
    const loadHw = async () => {
      try { hw = await api('GET', '/api/hardware'); } catch (e) { return; }
      if (hw.standalone) {
        $('#pr-status').innerHTML = '<span><span class="dot off"></span>ESP32 attendance server, productivity receiver (port 8081) and RFID reader need the Python server version (app.py). Records they saved are shown here as normal.</span>';
        $('#att-log').textContent = 'Hardware listeners are not available in the single HTML file version.';
        ['#att-start', '#att-stop'].forEach(s => { const b = $(s); if (b) b.disabled = true; });
        return;
      }
      const a = hw.attendance, p = hw.productivity, r = hw.rfid;
      $('#pr-status').innerHTML = `
        <span><span class="dot ${a.running ? 'on' : 'off'}"></span>Attendance server :${a.port} ${a.running ? 'running' : 'stopped'}</span>
        <span><span class="dot ${p.running ? 'on' : 'off'}"></span>Productivity receiver :${p.port} ${p.running ? 'running' : 'stopped'}
          <a href="#" id="pr-toggle">${p.running ? 'stop' : 'start'}</a></span>
        <span><span class="dot ${r.running ? 'on' : 'off'}"></span>RFID reader (UDP) ${r.reader_ip ? `@ ${esc(r.reader_ip)}` : ''}</span>`;
      $('#pr-toggle').onclick = async e => { e.preventDefault(); await act(api('POST', `/api/hardware/productivity/${p.running ? 'stop' : 'start'}`)); loadHw(); };
      $('#att-log').textContent = [...a.events].reverse().join('\n') || (a.error ? `Error: ${a.error}` : 'No activity yet.');
    };

    /* ---------------- job performance (links records to Job File schedules) ---------------- */
    const NO_JOB = '(No Job Number)';
    const jobNumbers = () => {
      const set = new Set((data.jobs || []).map(j => j.job_number).filter(Boolean));
      data.records.forEach(r => { if (r.job_number) set.add(r.job_number); });
      (data.line_records || []).forEach(r => { if (r.job_number) set.add(r.job_number); });
      return [...set].sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
    };
    const fillJobSelects = () => {
      const nums = jobNumbers();
      [['#jp-job', 'All jobs - overview'], ['#rf-job', 'All jobs']].forEach(([sel, first]) => {
        const s = $(sel), cur = s.value;
        s.innerHTML = `<option value="">${first}</option>` + nums.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')
          + (sel === '#rf-job' ? `<option value="${esc(NO_JOB)}">${esc(NO_JOB)}</option>` : '');
        if ([...s.options].some(o => o.value === cur)) s.value = cur;
      });
    };

    /* Combine a job's schedule (all its items) with the productivity records booked against it */
    function lineTotals(list) {   // list newest first
      const input = list.reduce((a, r) => a + r.line_input, 0), output = list.reduce((a, r) => a + r.line_output, 0);
      const pk = list.find(r => r.packing_balance !== null && r.packing_balance !== undefined);
      const balance = list.reduce((a, r) => a + r.line_balance, 0);   // saved balances, including admin edits
      return { input, output, balance, packing: pk ? pk.packing_balance : null, count: list.length };
    }

    function analyseJob(jobNo, recs, lineRecs = []) {
      const files = (data.jobs || []).filter(j => j.job_number === jobNo);
      const ops = [], index = {};
      const keyOf = (item, name) => `${norm(item)}|${norm(name)}`;
      files.forEach(f => f.operations.forEach(o => {
        const op = { item: f.item_name, seq: o.seq, name: o.operation_name, machine: o.machine_type, smv: num(o.smv),
          planned: true, pieces: 0, earned: 0, emps: new Set(), records: 0, last: '' };
        ops.push(op);
        index[keyOf(f.item_name, o.operation_name)] = op;
        if (!index[keyOf('', o.operation_name)]) index[keyOf('', o.operation_name)] = op;   // match records without an item
      }));
      const jr = recs.filter(r => r.job_number === jobNo);
      jr.forEach(r => {
        let op = index[keyOf(r.item_name, r.task_type)] || index[keyOf('', r.task_type)];
        if (!op) {   // booked against the job but not in its job file (renamed or removed operation)
          op = { item: r.item_name, seq: 999, name: r.task_type, machine: r.machine_type, smv: 0, planned: false,
            pieces: 0, earned: 0, emps: new Set(), records: 0, last: '' };
          ops.push(op);
          index[keyOf(r.item_name, r.task_type)] = op;
        }
        op.pieces += r.pieces;
        op.earned += r.pieces * op.smv;
        op.emps.add(r.employee_name);
        op.records++;
        if (`${r.date} ${r.slot_order}` > op.last) op.last = `${r.date} ${r.slot_order}`;
      });
      ops.sort((a, b) => (a.planned === b.planned ? 0 : a.planned ? -1 : 1) || String(a.item).localeCompare(String(b.item)) || a.seq - b.seq);
      ops.forEach(o => { o.last = o.last.split(' ')[0]; });
      const planned = ops.filter(o => o.planned);
      const pieces = jr.reduce((a, r) => a + r.pieces, 0);
      const started = planned.filter(o => o.pieces > 0);
      const bottleneck = pieces && planned.length ? planned.reduce((m, o) => (o.pieces < m.pieces ? o : m), planned[0]) : null;
      const dates = [...new Set(jr.map(r => r.date))].sort();
      const emps = {};
      jr.forEach(r => {
        const e = emps[r.employee_name] ||= { name: r.employee_name, id: r.employee_id, pieces: 0, ops: new Set(), earned: 0, days: new Set() };
        const op = index[keyOf(r.item_name, r.task_type)] || index[keyOf('', r.task_type)];
        e.pieces += r.pieces; e.ops.add(r.task_type); e.days.add(r.date); e.earned += r.pieces * (op ? op.smv : 0);
      });
      const lines = lineRecs.filter(r => r.job_number === jobNo);
      const allDates = [...new Set([...dates, ...lines.map(r => r.date)])].sort();
      return {
        lines, line: lineTotals(lines), allDates,
        jobNo, files, items: [...new Set([...files.map(f => f.item_name), ...jr.map(r => r.item_name)].filter(Boolean))],
        ops, planned, started, pieces, records: jr.length, earned: ops.reduce((a, o) => a + o.earned, 0),
        employees: Object.values(emps).sort((a, b) => b.pieces - a.pieces), dates, bottleneck,
        daily: jr.reduce((m, r) => { m[r.date] = (m[r.date] || 0) + r.pieces; return m; }, {}),
      };
    }

    const statCard = (label, value, ico, small = false) =>
      `<div class="stat"><div class="ico">${ico}</div><div class="label">${esc(label)}</div><div class="value" ${small ? 'style="font-size:17px"' : ''}>${value}</div></div>`;

    const jpAll = new DataTable($('#jp-all'), {
      rowKey: 'jobNo',
      columns: [
        { key: 'jobNo', label: 'Job Number' }, { key: 'items', label: 'Item(s)', value: r => r.items.join(', ') },
        { key: 'plannedCount', label: 'Operations', num: true, value: r => r.planned.length },
        { key: 'startedCount', label: 'Ops Started', num: true, value: r => r.started.length,
          render: r => r.planned.length ? `${r.started.length} / ${r.planned.length}` : '-' },
        { key: 'pieces', label: 'Total Pieces', num: true, render: r => fmtInt(r.pieces) },
        { key: 'earned', label: 'Earned Min', num: true, render: r => r.earned ? fmt(r.earned, 1) : '-' },
        { key: 'lineIn', label: 'Line In', num: true, value: r => r.line.input, render: r => r.line.count ? fmtInt(r.line.input) : '-' },
        { key: 'lineOut', label: 'Line Out', num: true, value: r => r.line.output, render: r => r.line.count ? fmtInt(r.line.output) : '-' },
        { key: 'lineBal', label: 'Line Balance', num: true, value: r => r.line.balance,
          render: r => !r.line.count ? '-' : r.line.balance < 0 ? `<span class="badge red">${fmtInt(r.line.balance)}</span>` : fmtInt(r.line.balance) },
        { key: 'packBal', label: 'Packing Bal.', num: true, value: r => r.line.packing ?? '', render: r => r.line.packing === null ? '-' : fmtInt(r.line.packing) },
        { key: 'empCount', label: 'Employees', num: true, value: r => r.employees.length },
        { key: 'first', label: 'First Day', value: r => r.allDates[0] || '' },
        { key: 'lastDay', label: 'Last Day', value: r => r.allDates.at(-1) || '' },
        { key: 'bn', label: 'Bottleneck', value: r => r.bottleneck ? r.bottleneck.name : '',
          render: r => r.bottleneck ? `<span class="badge red">${esc(r.bottleneck.name)} (${fmtInt(r.bottleneck.pieces)})</span>` : '-' },
      ],
      onSelect: r => { $('#jp-job').value = r.jobNo; drawJobs(); },
    });
    const jpOps = new DataTable($('#jp-ops'), {
      columns: [
        { key: 'item', label: 'Item' }, { key: 'seq', label: 'Seq', num: true, render: r => r.planned ? r.seq : '-' },
        { key: 'name', label: 'Operation', render: r => esc(r.name) + (r.planned ? '' : ' <span class="badge gray">not in job file</span>') },
        { key: 'machine', label: 'Machine Type' }, { key: 'smv', label: 'SMV', num: true, render: r => r.smv ? fmt(r.smv) : '-' },
        { key: 'pieces', label: 'Pieces Done', num: true, render: r => r.pieces ? fmtInt(r.pieces) : '<span class="badge red">0</span>' },
        { key: 'earned', label: 'Earned Min', num: true, render: r => r.earned ? fmt(r.earned, 1) : '-' },
        { key: 'emps', label: 'Employees', value: r => [...r.emps].join(', ') },
        { key: 'records', label: 'Entries', num: true }, { key: 'last', label: 'Last Entry' },
      ],
    });
    const jpEmps = new DataTable($('#jp-emps'), {
      columns: [
        { key: 'id', label: 'Employee ID' }, { key: 'name', label: 'Employee' },
        { key: 'pieces', label: 'Pieces', num: true, render: r => fmtInt(r.pieces) },
        { key: 'opsList', label: 'Operations', value: r => [...r.ops].join(', ') },
        { key: 'earned', label: 'Earned Min', num: true, render: r => r.earned ? fmt(r.earned, 1) : '-' },
        { key: 'dayCount', label: 'Days', num: true, value: r => r.days.size },
      ],
    });

    const jpLines = new DataTable($('#jp-lines'), {
      rowKey: 'id',
      columns: [
        { key: 'date', label: 'Date' },
        { key: 'recorded_at', label: 'Time', render: r => r.recorded_at ? esc(new Date(r.recorded_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })) : '-' },
        { key: 'line_input', label: 'Line In', num: true }, { key: 'line_output', label: 'Line Out', num: true },
        { key: 'line_balance', label: 'Balance', num: true,
          render: r => (r.line_balance < 0 ? `<span class="badge red">${r.line_balance}</span>` : r.line_balance)
            + (r.balance_edited ? ' <span class="badge gray" title="Edited by admin">✎ edited</span>' : '') },
        { key: 'packing_balance', label: 'Packing Bal.', num: true, render: r => r.packing_balance === null ? '-' : fmtInt(r.packing_balance) },
        { key: 'recorded_by', label: 'Entered By' },
      ],
      emptyText: 'No line entries for this job in this period',
    });
    $('#jp-line-del').onclick = async () => {
      const r = jpLines.selected;
      if (!r) return toast('Select a line entry first', 'error');
      if (!(await confirmBox(`Delete line entry of ${r.date}?\nLine In ${r.line_input} • Line Out ${r.line_output} • Packing ${r.packing_balance ?? '-'}`, 'Delete'))) return;
      if (await act(api('DELETE', `/api/line-records/${encodeURIComponent(r.id)}`))) load();
    };

    let jpCurrent = null;
    function drawJobs() {
      const period = $('#jp-period').value;
      const recs = periodFilter(data.records.filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date)), period);
      const jobNo = $('#jp-job').value;
      const lineRecs = periodFilter((data.line_records || []).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date)), period);
      const noJob = recs.filter(r => !r.job_number);
      $('#jp-note').textContent = noJob.length ? `${noJob.length} record(s) in this period have no job number` : '';
      $('#jp-overview').classList.toggle('hidden', !!jobNo);
      $('#jp-detail').classList.toggle('hidden', !jobNo);

      if (!jobNo) {
        const all = jobNumbers().map(n => analyseJob(n, recs, lineRecs));
        jpCurrent = { overview: all };
        jpAll.setRows(all);
        const active = all.filter(j => j.pieces > 0);
        $('#jp-cards').innerHTML =
          statCard('Job Numbers', fmtInt(all.length), '📁') +
          statCard('Jobs With Output', fmtInt(active.length), '🏭') +
          statCard('Pieces on Jobs', fmtInt(active.reduce((a, j) => a + j.pieces, 0)), '🧵') +
          statCard('Earned Minutes', fmt(active.reduce((a, j) => a + j.earned, 0), 0), '⏱️') +
          statCard('Line Balance (all jobs)', fmtInt(all.reduce((a, j) => a + j.line.balance, 0)), '⚖️') +
          statCard('No Job Number', fmtInt(noJob.reduce((a, r) => a + r.pieces, 0)) + ' <small style="font-size:12px;font-weight:500">pcs</small>', '❔');
        return;
      }

      const j = analyseJob(jobNo, recs, lineRecs);
      jpCurrent = { job: j };
      const bn = j.bottleneck;
      $('#jp-cards').innerHTML =
        statCard('Total Pieces', fmtInt(j.pieces), '🧵') +
        statCard('Earned Minutes', j.earned ? fmt(j.earned, 1) : '-', '⏱️') +
        statCard('Operations Started', `${j.started.length} / ${j.planned.length}`, '⚙️') +
        statCard('Employees', fmtInt(j.employees.length), '👥') +
        statCard('Days Active', fmtInt(j.allDates.length), '📅') +
        statCard('Line Input', j.line.count ? fmtInt(j.line.input) : '-', '📥') +
        statCard('Line Output', j.line.count ? fmtInt(j.line.output) : '-', '📤') +
        statCard('Line Balance', j.line.count ? `<span style="color:${j.line.balance < 0 ? 'var(--red, #e74c3c)' : 'inherit'}">${fmtInt(j.line.balance)}</span>` : '-', '⚖️') +
        statCard('Packing Balance', j.line.packing === null ? '-' : fmtInt(j.line.packing), '📦') +
        statCard('Bottleneck', bn ? `${esc(bn.name)}<br><small style="font-size:12px;font-weight:500">${fmtInt(bn.pieces)} pcs</small>` : '-', '🚧', true);
      $('#jp-ops-note').textContent = `${j.items.join(', ') || '-'}${j.files.length ? '' : ' • no job file found for this number'}`;
      jpOps.setRows(j.ops);
      jpEmps.setRows(j.employees);
      jpLines.setRows(j.lines);
      const c3 = $('#jp-c-line');
      const ld = {};
      j.lines.forEach(r => { const d = ld[r.date] ||= { in: 0, out: 0, bal: 0 }; d.in += r.line_input; d.out += r.line_output; d.bal += r.line_balance; });
      const lk = Object.keys(ld).sort();
      if (!lk.length) emptyChart(c3, 'No line entries for this job in this period'); else {
        showCanvas(c3);
        let running = 0;
        const cum = lk.map(k => (running += ld[k].bal));
        chart(c3, {
          data: {
            labels: lk,
            datasets: [
              { type: 'bar', label: 'Line Input', data: lk.map(k => ld[k].in), backgroundColor: Theme.alt, borderRadius: 6, order: 2 },
              { type: 'bar', label: 'Line Output', data: lk.map(k => ld[k].out), backgroundColor: Theme.ink, borderRadius: 6, order: 2 },
              { type: 'line', label: 'Line Balance (running)', data: cum, borderColor: Theme.bad, backgroundColor: Theme.bad, tension: .3, order: 1 },
            ],
          },
          options: { scales: { y: { beginAtZero: true } } },
        });
      }

      const c1 = $('#jp-c-ops');
      if (!j.ops.length) emptyChart(c1, 'No operations in the job file'); else {
        showCanvas(c1);
        const multi = j.items.length > 1;
        chart(c1, {
          type: 'bar',
          data: {
            labels: j.ops.map(o => `${o.planned ? o.seq + '. ' : ''}${o.name}${multi && o.item ? ' (' + o.item + ')' : ''}`),
            datasets: [{ label: 'Pieces', data: j.ops.map(o => o.pieces),
              backgroundColor: j.ops.map(o => (bn && o === bn ? Theme.bad : o.planned ? Theme.ink : Theme.alt)), borderRadius: 6 }],
          },
          options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } },
        });
      }
      const c2 = $('#jp-c-daily'), dk = Object.keys(j.daily).sort();
      if (!dk.length) emptyChart(c2, 'No output recorded for this job in this period'); else {
        showCanvas(c2);
        chart(c2, { type: dk.length === 1 ? 'bar' : 'line',
          data: { labels: dk, datasets: [{ label: 'Pieces', data: dk.map(k => j.daily[k]), borderColor: Theme.ink, backgroundColor: dk.length === 1 ? Theme.ink : Theme.soft, fill: true, tension: .3 }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
      }
    }
    $('#jp-job').onchange = drawJobs;
    $('#jp-period').onchange = drawJobs;
    $('#jp-export').onclick = () => {
      if (!jpCurrent) return;
      if (jpCurrent.overview) {
        download(`job_performance_${today()}.csv`, toCSV(jpCurrent.overview, jpAll.columns.map(c => ({ label: c.label, value: r => jpAll.cellValue(c, r) }))));
      } else {
        const j = jpCurrent.job;
        if (j.lines.length) download(`job_${j.jobNo.replace(/[^\w-]+/g, '_')}_line_status_${today()}.csv`, toCSV(j.lines.map(r => ({ ...r, job: j.jobNo })), [
          { key: 'job', label: 'Job Number' }, { key: 'date', label: 'Date' }, { key: 'line_input', label: 'Line Input' },
          { key: 'line_output', label: 'Line Output' }, { key: 'line_balance', label: 'Line Balance' },
          { key: 'balance_edited', label: 'Balance Edited', value: r => r.balance_edited ? 'Yes' : 'No' },
          { key: 'packing_balance', label: 'Packing Balance', value: r => r.packing_balance ?? '' },
          { key: 'recorded_by', label: 'Entered By' }, { key: 'recorded_at', label: 'Recorded At' }]));
        download(`job_${j.jobNo.replace(/[^\w-]+/g, '_')}_${today()}.csv`, toCSV(j.ops.map(o => ({ ...o, job: j.jobNo })), [
          { key: 'job', label: 'Job Number' }, ...jpOps.columns.map(c => ({ label: c.label, value: r => c.key === 'name' ? r.name : jpOps.cellValue(c, r) }))]));
      }
    };

    const load = async () => {
      data = await api('GET', '/api/productivity');
      data.jobs = data.jobs || [];
      attTable.setRows([...data.attendance].sort((x, y) => `${dmyToIso(y.date)}${y.time_in}`.localeCompare(`${dmyToIso(x.date)}${x.time_in}`)));
      empTable.setRows(data.employees);
      const so = r => String(r.slot_order ?? r.hour * 60).padStart(5, '0');
      recTable.setRows([...data.records].sort((x, y) => `${y.date}${so(y)}${y.recorded_at}`.localeCompare(`${x.date}${so(x)}${x.recorded_at}`)));
      fillJobSelects();
      applyRecFilter();
      quickStats();
      if ($('.tab[data-tab=dash]', el).classList.contains('active')) drawDashboard();
      if ($('.tab[data-tab=job]', el).classList.contains('active')) drawJobs();
    };
    $('#pr-reload').onclick = () => Promise.all([load(), loadHw()]).then(() => toast('Data refreshed', 'success'));

    await Promise.all([load(), loadHw()]);
    every(10000, () => { if ($('#pd-auto')?.checked) load().catch(() => {}); loadHw(); });
  },
});

</script>
<script>/* ===== jobfile ===== */
/* Job File - operation schedule per Job Number + Item */
'use strict';

registerPage('jobfile', {
  title: 'Job File',
  module: 'jobfile',
  async render(el) {
    const canEdit = canUse('jobfile_edit');
    el.innerHTML = `
      <div class="page-head"><div><h1>📁 Job File</h1>
        <div class="sub">Operation schedule for every item in each job</div></div>
        <div class="actions">
          <button class="btn primary" id="j-new">➕ New Job File</button>
        </div></div>

      <div class="card">
        <h3>Job Details <span class="editing-note" id="j-mode">New job file</span></h3>
        <form id="j-form" autocomplete="off" onsubmit="return false">
          <div class="form-grid">
            ${field('job_number', 'Job Number', { required: true, placeholder: 'e.g. JOB-2026-014', list: 'j-job-list' })}
            ${field('item_name', 'Item Name', { required: true, placeholder: 'e.g. Classic Polo', list: 'j-item-list' })}
            ${field('notes', 'Job Notes', { cls: 'wide', placeholder: 'Optional - customer, style no., remarks…' })}
          </div>
          <datalist id="j-job-list"></datalist>
          <datalist id="j-item-list"></datalist>
        </form>
      </div>

      <div class="card">
        <h3>⚙️ Operation Schedule <span class="right" id="j-summary"></span></h3>
        <div class="table-wrap" style="max-height:none">
          <table class="data" id="j-ops">
            <thead><tr>
              <th style="width:52px">Seq</th><th>Operation Name</th><th style="width:300px">Machine Type</th>
              <th style="width:100px">SMV (min)</th><th style="width:22%">Notes</th><th style="width:118px"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <datalist id="j-op-list"></datalist>
        <datalist id="j-machine-list"></datalist>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="j-add-op">➕ Add Operation</button>
          <span style="flex:1"></span>
          <button type="button" class="btn success" id="j-save">💾 Save Job File</button>
          <button type="button" class="btn purple" id="j-dup">⧉ Duplicate</button>
          <button type="button" class="btn ghost" id="j-print">🖨️ Print</button>
          <button type="button" class="btn danger" id="j-delete">🗑️ Delete</button>
        </div>
        <div id="j-machines" class="status-bar" style="flex-wrap:wrap;margin-top:12px"></div>
      </div>

      <div class="card">
        <h3>📂 Job Files</h3>
        <div class="toolbar" id="j-search"></div>
        <div id="j-table"></div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn ghost sm" id="j-export">⬇️ Export all operations (CSV)</button>
        </div>
      </div>`;

    const form = $('#j-form');
    const tbody = $('#j-ops tbody');
    let meta = { machine_types: [], operation_names: [], items: [] };
    let editingKey = null;
    let ops = [];
    let dirty = false;

    /* ---------------- operation rows ---------------- */
    const blankOp = () => ({ operation_name: '', machine_type: '', smv: '', notes: '' });

    function drawOps() {
      if (!ops.length) ops.push(blankOp());
      tbody.innerHTML = ops.map((o, i) => `
        <tr data-i="${i}" style="cursor:default">
          <td class="num"><b>${i + 1}</b></td>
          <td><input class="op-in cell-input" data-k="operation_name" list="j-op-list" value="${esc(o.operation_name)}" placeholder="e.g. Collar attach"></td>
          <td><input class="op-in cell-input" data-k="machine_type" list="j-machine-list" value="${esc(o.machine_type)}" placeholder="Select or type"></td>
          <td><input class="op-in cell-input" data-k="smv" type="number" step="0.01" min="0" value="${esc(o.smv)}" placeholder="0.00"></td>
          <td><input class="op-in cell-input" data-k="notes" value="${esc(o.notes)}" placeholder="Optional"></td>
          <td style="white-space:nowrap">
            <button class="btn ghost sm op-up" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button class="btn ghost sm op-down" title="Move down" ${i === ops.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="btn ghost sm op-del" title="Remove">✕</button>
          </td>
        </tr>`).join('');
      summarize();
    }

    function summarize() {
      const filled = ops.filter(o => o.operation_name.trim());
      const smv = filled.reduce((a, o) => a + num(o.smv), 0);
      $('#j-summary').textContent = `${filled.length} operation(s) • Total SMV ${smv.toFixed(2)} min`;
      const m = {};
      filled.forEach(o => { const k = o.machine_type.trim() || 'Not set'; m[k] = (m[k] || 0) + 1; });
      $('#j-machines').innerHTML = Object.keys(m).length
        ? '<b style="margin-right:6px">Machines needed:</b>' + Object.entries(m).sort((a, b) => b[1] - a[1])
          .map(([k, v]) => `<span class="badge ${k === 'Not set' ? 'red' : 'blue'}">${esc(k)} × ${v}</span>`).join(' ')
        : '';
    }

    tbody.addEventListener('input', e => {
      const inp = e.target.closest('.op-in');
      if (!inp) return;
      ops[+inp.closest('tr').dataset.i][inp.dataset.k] = inp.value;
      dirty = true;
      summarize();
    });
    tbody.addEventListener('keydown', e => {
      // Enter in the last row's field adds a new operation row
      if (e.key !== 'Enter' || !e.target.closest('.op-in')) return;
      e.preventDefault();
      const i = +e.target.closest('tr').dataset.i;
      if (i === ops.length - 1) addOp(); else $(`tr[data-i="${i + 1}"] .op-in`, tbody).focus();
    });
    tbody.addEventListener('click', e => {
      const tr = e.target.closest('tr');
      if (!tr) return;
      const i = +tr.dataset.i;
      if (e.target.closest('.op-up') && i > 0) [ops[i - 1], ops[i]] = [ops[i], ops[i - 1]];
      else if (e.target.closest('.op-down') && i < ops.length - 1) [ops[i + 1], ops[i]] = [ops[i], ops[i + 1]];
      else if (e.target.closest('.op-del')) ops.splice(i, 1);
      else return;
      dirty = true;
      drawOps();
    });
    const addOp = () => {
      ops.push(blankOp());
      dirty = true;
      drawOps();
      $(`tr[data-i="${ops.length - 1}"] .op-in`, tbody).focus();
    };
    $('#j-add-op').onclick = addOp;
    form.addEventListener('input', () => { dirty = true; });

    /* ---------------- job list ---------------- */
    const table = new DataTable($('#j-table'), {
      rowKey: 'key',
      columns: [
        { key: 'job_number', label: 'Job Number' }, { key: 'item_name', label: 'Item Name' },
        { key: 'op_count', label: 'Operations', num: true }, { key: 'total_smv', label: 'Total SMV', num: true, render: r => fmt(r.total_smv) },
        { key: 'machines', label: 'Machine Types', value: r => r.machines.join(', ') },
        { key: 'updated_at', label: 'Last Updated', value: r => r.updated_at || r.created_at },
      ],
      onSelect: r => loadJob(r),
    });
    searchBar($('#j-search'), table, {
      options: [['*', 'All fields'], ['job_number', 'Job Number'], ['item_name', 'Item Name'], ['ops_text', 'Operation / Machine']],
      placeholder: 'Search job, item, operation or machine…',
    });

    async function confirmDiscard() {
      return !dirty || confirmBox('You have unsaved changes in this job file. Discard them?', 'Discard', 'warning');
    }

    async function loadJob(r) {
      if (editingKey === r.key) return;
      if (!(await confirmDiscard())) { table.clearSelection(); return; }
      editingKey = r.key;
      fillForm(form, r);
      ops = r.operations.map(o => ({ operation_name: o.operation_name || '', machine_type: o.machine_type || '', smv: o.smv ?? '', notes: o.notes || '' }));
      dirty = false;
      $('#j-mode').textContent = `Editing ${r.job_number} • ${r.item_name}`;
      drawOps();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      $('#content').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function newJob(keepOps = false) {
      editingKey = null;
      const keep = readForm(form);
      resetForm(form);
      if (keepOps) { form.elements.item_name.value = keep.item_name; form.elements.notes.value = keep.notes; }
      if (!keepOps) ops = [];
      dirty = keepOps;
      table.clearSelection();
      $('#j-mode').textContent = keepOps ? 'Copy - enter the new Job Number (and Item if different), then Save' : 'New job file';
      drawOps();
    }
    $('#j-new').onclick = async () => { if (await confirmDiscard()) newJob(); };

    async function load() {
      const r = await api('GET', '/api/jobfiles');
      meta = r;
      r.rows.forEach(x => { x.ops_text = x.operations.map(o => `${o.operation_name} ${o.machine_type}`).join(' | '); });
      table.setRows(r.rows);
      $('#j-job-list').innerHTML = [...new Set(r.rows.map(x => x.job_number))].map(v => `<option value="${esc(v)}">`).join('');
      $('#j-item-list').innerHTML = r.items.map(v => `<option value="${esc(v)}">`).join('');
      $('#j-op-list').innerHTML = r.operation_names.map(v => `<option value="${esc(v)}">`).join('');
      $('#j-machine-list').innerHTML = r.machine_types.map(v => `<option value="${esc(v)}">`).join('');
    }

    /* ---------------- save / delete / duplicate ---------------- */
    $('#j-save').onclick = async () => {
      if (!canEdit) return toast("You don't have permission to edit job files", 'error');
      const d = readForm(form);
      const payload = { job_number: d.job_number, item_name: d.item_name, notes: d.notes,
        operations: ops.filter(o => o.operation_name.trim() || o.machine_type.trim() || String(o.smv).trim() || o.notes.trim()) };
      const r = await act(editingKey
        ? api('PUT', `/api/jobfiles/${encodeURIComponent(editingKey)}`, payload)
        : api('POST', '/api/jobfiles', payload));
      if (!r) return;
      dirty = false;
      if (r.key) editingKey = r.key;
      await load();
      const row = table.rows.find(x => x.key === editingKey);
      if (row) { $('#j-mode').textContent = `Editing ${row.job_number} • ${row.item_name}`; table.selected = row; table.render(); }
    };
    $('#j-delete').onclick = async () => {
      if (!editingKey) return toast('Select a job file in the list first', 'error');
      const d = readForm(form);
      if (!(await confirmBox(`Delete job file ${d.job_number} - ${d.item_name} and its ${ops.length} operation(s)?`, 'Delete'))) return;
      if (await act(api('DELETE', `/api/jobfiles/${encodeURIComponent(editingKey)}`))) { dirty = false; newJob(); load(); }
    };
    $('#j-dup').onclick = () => {
      if (!ops.some(o => o.operation_name.trim())) return toast('Nothing to duplicate - add operations first', 'warn');
      ops = ops.map(o => ({ ...o }));
      newJob(true);
      toast('Operations copied. Enter the new Job Number and Save.');
      form.elements.job_number.focus();
    };

    /* ---------------- print / export ---------------- */
    $('#j-print').onclick = () => {
      const d = readForm(form);
      const list = ops.filter(o => o.operation_name.trim());
      if (!list.length) return toast('No operations to print', 'warn');
      const smv = list.reduce((a, o) => a + num(o.smv), 0);
      const w = window.open('', '_blank');
      if (!w) return toast('Allow pop-ups to print', 'warn');
      w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Job File ${esc(d.job_number)}</title>
        <style>body{font-family:Segoe UI,Arial,sans-serif;color:#1d2939;max-width:900px;margin:24px auto;padding:0 20px}
        h1{margin:0 0 4px;font-size:24px} .meta{display:flex;gap:30px;margin:12px 0 18px;font-size:14px}
        table{width:100%;border-collapse:collapse;font-size:13px} th,td{border:1px solid #cfd6e0;padding:7px 9px;text-align:left}
        th{background:#eef2f8} td.n{text-align:right} tfoot td{font-weight:700;background:#f6f8fb}
        .bar{text-align:right;margin-bottom:10px} @media print{.bar{display:none}}</style></head><body>
        <div class="bar"><button onclick="print()">🖨️ Print / Save as PDF</button></div>
        <h1>JOB FILE - Operation Schedule</h1>
        <div class="meta"><div><b>Job Number:</b> ${esc(d.job_number)}</div><div><b>Item:</b> ${esc(d.item_name)}</div>
          <div><b>Printed:</b> ${esc(new Date().toLocaleString('en-GB'))}</div></div>
        ${d.notes ? `<p><b>Notes:</b> ${esc(d.notes)}</p>` : ''}
        <table><thead><tr><th>Seq</th><th>Operation</th><th>Machine Type</th><th>SMV (min)</th><th>Notes</th></tr></thead><tbody>
        ${list.map((o, i) => `<tr><td class="n">${i + 1}</td><td>${esc(o.operation_name)}</td><td>${esc(o.machine_type)}</td><td class="n">${o.smv === '' ? '' : num(o.smv).toFixed(2)}</td><td>${esc(o.notes)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td></td><td>${list.length} operations</td><td></td><td class="n">${smv.toFixed(2)}</td><td></td></tr></tfoot></table>
        </body></html>`);
      w.document.close();
    };
    $('#j-export').onclick = () => {
      const lines = [];
      table.view.forEach(j => j.operations.forEach((o, i) => lines.push({
        job_number: j.job_number, item_name: j.item_name, seq: i + 1, operation_name: o.operation_name,
        machine_type: o.machine_type, smv: o.smv ?? '', notes: o.notes || '',
      })));
      if (!lines.length) return toast('No operations to export', 'warn');
      download(`job_files_${today()}.csv`, toCSV(lines, [
        { key: 'job_number', label: 'Job Number' }, { key: 'item_name', label: 'Item Name' }, { key: 'seq', label: 'Seq' },
        { key: 'operation_name', label: 'Operation' }, { key: 'machine_type', label: 'Machine Type' },
        { key: 'smv', label: 'SMV (min)' }, { key: 'notes', label: 'Notes' }]));
    };

    if (!canEdit) {
      ['#j-save', '#j-delete', '#j-dup', '#j-add-op', '#j-new'].forEach(s => { $(s).disabled = true; });
      $('#j-mode').textContent = 'View only for your role';
    }

    App.cleanup.push(() => { dirty = false; });
    drawOps();
    await load();
  },
});

</script>
<script>/* ===== app ===== */
/* ApparelFlow web - login, navigation and routing */
'use strict';

const NAV = [
  ['dashboard', '🏠', 'Dashboard'],
  ['employees', '👥', 'Employees'],
  ['suppliers', '🚚', 'Suppliers'],
  ['categories', '📂', 'Categories'],
  ['products', '👕', 'Products'],
  ['sales', '💰', 'Sales'],
  ['barcode', '🏷️', 'Barcode'],
  ['materials', '🧵', 'Raw Materials'],
  ['productivity', '📊', 'Emp Productivity'],
  ['jobfile', '📁', 'Job File'],
];

function showLogin() {
  App.user = null;
  runCleanup();
  $('#app-view').classList.add('hidden');
  $('#login-view').classList.remove('hidden');
  $('#login-id').focus();
}

function showApp() {
  $('#login-view').classList.add('hidden');
  $('#app-view').classList.remove('hidden');
  $('#user-name').textContent = `Welcome, ${App.user.name || App.user.id}`;
  $('#user-role').textContent = App.user.role || 'User';
  $('#nav').innerHTML = NAV.map(([id, ico, label]) => {
    const page = App.pages[id];
    const allowed = canUse(page?.module);
    return `<button class="nav-item ${allowed ? '' : 'locked'}" data-page="${id}" title="${allowed ? '' : 'No access for your role'}">
      <span class="ico">${ico}</span>${esc(label)}${allowed ? '' : ' 🔒'}</button>`;
  }).join('');
  route();
}

function runCleanup() {
  document.querySelectorAll('.modal-back').forEach(m => m.remove());
  App.cleanup.forEach(fn => { try { fn(); } catch (e) { /* ignore */ } });
  App.cleanup = [];
}

async function route() {
  if (!App.user) return;
  const id = (location.hash.replace('#/', '') || 'dashboard').split('?')[0];
  const page = App.pages[id] || App.pages.dashboard;
  const pageId = App.pages[id] ? id : 'dashboard';
  $$('.nav-item[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
  $('#sidebar').classList.remove('open');
  runCleanup();
  const content = $('#content');
  if (!canUse(page.module)) {
    content.innerHTML = `<div class="card empty"><h2>🔒 Access Denied</h2><p>You don't have permission to access this portal.</p>
      <p class="sub">Your role: <b>${esc(App.user.role)}</b></p></div>`;
    return;
  }
  content.innerHTML = '<div class="page-loading"><span class="spinner"></span> Loading…</div>';
  try {
    await page.render(content);
  } catch (e) {
    console.error(e);
    content.innerHTML = `<div class="card"><h3>⚠️ Could not load this page</h3><p>${esc(e.message)}</p>
      <button class="btn primary" onclick="route()">Try again</button></div>`;
  }
}

/* ---------------- events ---------------- */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#login-btn');
  $('#login-error').textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in…';
  try {
    const r = await api('POST', '/api/login', readForm(e.target));
    App.user = r.user;
    App.perms = r.perms;
    $('#login-pw').value = '';
    if (!location.hash) location.hash = '#/dashboard';
    showApp();
  } catch (err) {
    $('#login-error').textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login to Dashboard';
  }
});

$('#forgot-link').onclick = e => { e.preventDefault(); toast('Please contact your system administrator'); };

$('#logout-btn').onclick = async () => {
  if (!(await confirmBox('Do you want to logout?', 'Logout'))) return;
  await api('POST', '/api/logout').catch(() => {});
  location.hash = '';
  showLogin();
};

$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (!b) return;
  if (b.classList.contains('locked')) { toast("You don't have permission to access this portal", 'error'); return; }
  const target = `#/${b.dataset.page}`;
  if (location.hash === target) route(); else location.hash = target;
});

document.querySelectorAll('.theme-toggle').forEach(b => b.addEventListener('click', () => {
  Theme.toggle();
  if (App.user && !$('#app-view').classList.contains('hidden')) {
    $$('canvas').forEach(c => { if (c._chart) c._chart.update('none'); });
    route();   // re-render so every chart picks up the new colours
  }
}));
Theme.updateButtons();

$('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');
window.addEventListener('hashchange', route);

setInterval(() => {
  const d = new Date();
  $('#clock').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }) +
    '  ' + d.toLocaleTimeString('en-GB');
}, 1000);

/* ---------------- boot ---------------- */
(async () => {
  try {
    const r = await api('GET', '/api/me');
    App.user = r.user;
    App.perms = r.perms;
    App.mode = r.mode;
    showApp();
  } catch (e) {
    showLogin();
  }
})();

</script>
<script>
(() => {
  const n = $('#mode-note');
  n.classList.remove('hidden');
  if (CONFIG.DEMO) {
    n.innerHTML = 'DEMO MODE - local sample data, not Firebase.<br>Logins: EMP001 / admin123 (Admin), EMP002 / store123, EMP003 / emp123<br>' +
      '<a href="#" id="demo-exit">Exit demo</a> · <a href="#" id="demo-reset">Reset sample data</a>';
    $('#demo-exit').onclick = e => { e.preventDefault(); SS.removeItem('af_demo'); Session.clear(); location.href = location.pathname; };
    $('#demo-reset').onclick = e => { e.preventDefault(); LS.removeItem(LocalDemo.KEY); location.reload(); };
  } else {
    n.style.background = '#EBF5FB'; n.style.borderColor = '#AED6F1'; n.style.color = '#1F618D';
    n.innerHTML = 'Connected to: ' + esc(CONFIG.DB_URL.replace('https://', '')) + '<br><a href="#" id="demo-go">Try demo with sample data</a>';
    $('#demo-go').onclick = e => { e.preventDefault(); SS.setItem('af_demo', '1'); Session.clear(); location.href = location.pathname + '?demo'; };
  }
})();
</script>
