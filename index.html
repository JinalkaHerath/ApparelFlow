  const sec = (title, rows) => `<h2>${title}</h2><table>${rows.join('')}</table>`;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Invoice ${g('invoice_number')}</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;color:#2C3E50;max-width:760px;margin:24px auto;padding:0 20px}
    header{background:#2C3E50;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-radius:6px}
    header h1{margin:0;font-size:28px;letter-spacing:2px} header div{text-align:right;font-size:13px}
    h2{font-size:15px;border-bottom:2px solid #3498DB;padding-bottom:4px;margin:22px 0 8px}
    table{width:100%;border-collapse:collapse;font-size:14px} th{text-align:left;width:180px;color:#566573;font-weight:600;padding:4px 0} td{padding:4px 0}
    .total{font-size:20px;font-weight:700;text-align:right;margin-top:18px}
    .foot{margin-top:30px;font-size:11px;color:#7F8C8D}
    .bar{margin:16px 0;text-align:right} @media print{.bar{display:none}}
  </style></head><body>
  <div class="bar"><button onclick="print()">🖨️ Print / Save as PDF</button></div>
  <header><h1>INVOICE</h1><div><b>ApparelFlow</b><br>Inventory Management System</div></header>
  ${sec('Order', [row('Invoice Number', g('invoice_number')), row('Sale ID', esc(sale.id)), row('Order ID', g('order_id')), row('Order Date', g('order_date'))])}
  ${sec('Customer Details', [row('Name', g('customer_name')), row('Contact', g('customer_contact')), row('Billing Address', g('billing_address')), row('Shipping Address', g('shipping_address'))])}
  ${sec('Product Details', [row('Product ID', g('sku')), row('Product Name', g('product_name')), row('Category', g('category')), row('Size', g('size')), row('Description', g('description'))])}
  ${sec('Pricing Details', [row('Unit Price', `Rs ${g('unit_price')}`), row('Quantity', g('bulk_price')), row('Discount', `${g('discount')}%`), row('Final Price', `Rs ${g('final_price')}`)])}
  ${sec('Transaction Details', [row('Payment Method', g('payment_method')), row('Payment Status', g('payment_status')), row('Change Given', `Rs ${g('change_given')}`), row('Salesperson', g('salesperson_name'))])}
  <div class="total">Total Amount: Rs ${g('total_amount')}</div>
  <div class="foot">Generated ${esc(new Date().toLocaleString('en-GB'))}</div>
  </body></html>`;
  const w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups to open the invoice', 'warn'); return; }
  w.document.write(html);
  w.document.close();
}

</script>
<script>/* ===== dashboard ===== */
/* Dashboard (dashboard.py) */
'use strict';

registerPage('dashboard', {
  title: 'Dashboard',
  async render(el) {
    el.innerHTML = `
      <div class="page-head">
        <div><h1>Dashboard</h1><div class="sub">Live overview • refreshes every 15 seconds</div></div>
        <div class="actions"><button class="btn ghost" id="d-refresh">🔄 Refresh</button></div>
      </div>
      <div class="stats" id="d-stats"></div>
      <div class="grid cols-2">
        <div class="card"><h3>📊 Today's Production Performance <span class="right" id="d-prod-date"></span></h3>
          <div class="chart-box"><canvas id="d-prod"></canvas></div></div>
        <div class="card"><h3>🏆 Top 10 Employee Performance
            <select id="d-emp-period" class="right" style="padding:4px 8px;border-radius:8px;font-size:12px">
              <option value="today">Today</option><option value="month" selected>This Month</option><option value="all">All Time</option>
            </select></h3>
          <div class="chart-box"><canvas id="d-emp"></canvas></div></div>
      </div>
      <div class="grid cols-2">
        <div class="card"><h3>📦 Raw Material Stock Distribution</h3>
          <div class="chart-box"><canvas id="d-mat"></canvas></div></div>
        <div class="card"><h3>⚠️ Low Stock Materials</h3><div id="d-low"></div></div>
      </div>
      <div class="status-bar"><span><span class="dot on"></span>Dashboard Status: Active</span><span id="d-last"></span><span id="d-mode"></span></div>`;

    const cards = [
      ['employees', 'Employees', '👥', '#2C3E50', 'employees'],
      ['suppliers', 'Suppliers', '🚚', '#9B59B6', 'suppliers'],
      ['categories', 'Categories', '📂', '#27AE60', 'categories'],
      ['products', 'Products', '👕', '#3498DB', 'products'],
      ['sales', 'Sales', '💰', '#E74C3C', 'sales'],
      ['barcodes', 'Barcodes', '🏷️', '#16A085', 'barcode'],
      ['raw_materials', 'Raw Materials', '🧵', '#F39C12', 'materials'],
      ['low_stock', 'Low Stock Items', '⚠️', '#C0392B', 'materials'],
      ['job_files', 'Job Files', '📁', '#6366F1', 'jobfile'],
    ];

    let lastData = null;
    const PERIOD_TEXT = { today: 'today', month: 'this month', all: 'yet' };
    function drawEmployees() {
      const ec = $('#d-emp');
      const period = $('#d-emp-period').value;
      const list = (lastData && lastData.employee_perf && lastData.employee_perf[period]) || [];
      if (!list.length) { emptyChart(ec, `No productivity records ${PERIOD_TEXT[period]}`); return; }
      showCanvas(ec);
      chart(ec, {
        type: 'bar',
        data: {
          labels: list.map(e => e.name),
          datasets: [{ label: 'Pieces', data: list.map(e => e.pieces),
            backgroundColor: list.map((_, i) => (i === 0 ? Theme.ink : Theme.alt)), borderRadius: 6, maxBarThickness: 30 }],
        },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${fmtInt(c.raw)} pieces` } } },
          scales: { x: { beginAtZero: true, title: { display: true, text: 'Pieces' } } },
        },
      });
    }
    $('#d-emp-period').onchange = drawEmployees;

    const load = async () => {
      const d = await api('GET', '/api/dashboard');
      $('#d-stats').innerHTML = cards.map(([k, label, ico, color, page]) => `
        <div class="stat clickable" style="--accent:${color}" data-go="${page}">
          <div class="ico">${ico}</div><div class="label">${label}</div><div class="value">${fmtInt(d.counts[k])}</div></div>`).join('') +
        `<div class="stat clickable" style="--accent:#1ABC9C" data-go="sales"><div class="ico">📅</div>
          <div class="label">Sales this month</div><div class="value" style="font-size:22px">Rs ${fmt(d.month_sales, 0)}</div></div>`;
      $$('#d-stats [data-go]').forEach(c => c.onclick = () => { location.hash = `#/${c.dataset.go}`; });

      $('#d-prod-date').textContent = today();
      const pc = $('#d-prod');
      if (!d.production.length) emptyChart(pc, 'No production data for today');
      else {
        showCanvas(pc);
        chart(pc, {
          type: 'bar',
          data: {
            labels: d.production.map(p => p.product),
            datasets: [
              { label: 'Produced', data: d.production.map(p => p.produced), backgroundColor: Theme.ink, borderRadius: 8 },
              { label: 'Damaged', data: d.production.map(p => p.damaged), backgroundColor: Theme.bad, borderRadius: 8 },
            ],
          },
          options: { scales: { y: { beginAtZero: true, title: { display: true, text: 'Quantity' } } } },
        });
      }

      lastData = d;
      drawEmployees();

      const mc = $('#d-mat');
      const stock = d.stock.filter(s => s.stock > 0);
      if (!stock.length) emptyChart(mc, 'No material data');
      else {
        showCanvas(mc);
        chart(mc, {
          type: 'doughnut',
          data: { labels: stock.map(s => `${s.name} (${s.unit})`), datasets: [{ data: stock.map(s => s.stock), backgroundColor: PALETTE }] },
          options: { plugins: { legend: { position: 'right' } } },
        });
      }

      const low = d.stock.filter(s => s.low);
      $('#d-low').innerHTML = !low.length
        ? '<div class="empty">✅ All materials are above their minimum stock level</div>'
        : `<div class="table-wrap"><table class="data"><thead><tr><th>Material</th><th>Current stock</th></tr></thead><tbody>${
          low.map(s => `<tr class="row-low" onclick="location.hash='#/materials'"><td>${esc(s.name)}</td><td class="num">${fmt(s.stock)} ${esc(s.unit)}</td></tr>`).join('')
        }</tbody></table></div>`;
      $('#d-last').textContent = `Last Refresh: ${new Date().toLocaleTimeString('en-GB')}`;
      $('#d-mode').textContent = App.mode === 'demo' ? '⚠️ DEMO MODE - local sample data, not Firebase' : '';
    };

    $('#d-refresh').onclick = () => load().then(() => toast('Dashboard refreshed', 'success')).catch(e => toast(e.message, 'error'));
    await load();
    every(15000, () => load().catch(() => {}));
  },
});

</script>
<script>/* ===== employees ===== */
/* Employee management (employees.py) */
'use strict';

registerPage('employees', {
  title: 'Employees',
  module: 'employees',
  async render(el) {
    el.innerHTML = `
      <div class="page-head"><div><h1>👥 Details of Employee</h1><div class="sub">Add, update and remove staff accounts</div></div></div>
      <div class="card">
        <h3>Employee details <span class="editing-note" id="e-mode"></span></h3>
        <form id="e-form" autocomplete="off">
          <div class="form-grid">
            ${field('id', 'Employee ID', { required: true })}
            ${field('name', 'Name', { required: true })}
            ${field('email', 'Email', { type: 'email', required: true })}
            ${field('gender', 'Gender', { type: 'select', options: ['Male', 'Female'], required: true })}
            ${field('dob', 'Date of Birth', { type: 'date', required: true })}
            ${field('contact', 'Contact', { required: true })}
            ${field('employment_type', 'Employment Type', { type: 'select', options: ['Full Time', 'Part Time', 'Contract', 'Intern'], required: true })}
            ${field('education', 'Education', { type: 'select', options: ['B.Sc', 'M.Sc', 'Phd', 'Diplomat'], required: true })}
            ${field('work_shift', 'Work-shift', { type: 'select', options: ['Day-shift', 'Night-shift'], required: true })}
            ${field('doj', 'Date of Join', { type: 'date', required: true })}
            ${field('salary', 'Salary', { required: true })}
            ${field('usertype', 'User Type', { type: 'select', options: ['Admin', 'Store Manager', 'Employee', 'fabric cutters', 'sewing', 'machine operators', 'quality inspectors'], required: true })}
            ${field('password', 'Password', { required: true })}
            ${field('rfid', 'RFID', { help: 'Type or scan the card UID', button: '<button type="button" class="btn teal sm" id="e-rfid">📡 Capture RFID</button>' })}
            ${field('address', 'Address', { type: 'textarea', cls: 'wide', required: true })}
          </div>
          <div class="form-actions">
            <button type="button" class="btn success" id="e-add">➕ Add</button>
            <button type="button" class="btn primary" id="e-update">✏️ Update</button>
            <button type="button" class="btn danger" id="e-delete">🗑️ Delete</button>
            <button type="button" class="btn ghost" id="e-clear">Clear</button>
          </div>
        </form>
      </div>
      <div class="card">
        <div class="toolbar" id="e-search"></div>
        <div id="e-table"></div>
        <div class="toolbar" style="margin-top:10px"><button class="btn ghost sm" id="e-export">⬇️ Export CSV</button></div>
      </div>`;

    const form = $('#e-form');
    const idInput = form.elements.id;
    let editing = null;

    const table = new DataTable($('#e-table'), {
      columns: [
        { key: 'id', label: 'Emp ID' }, { key: 'name', label: 'Name' }, { key: 'email', label: 'Email' },
        { key: 'gender', label: 'Gender' }, { key: 'dob', label: 'DOB' }, { key: 'contact', label: 'Contact' },
        { key: 'employment_type', label: 'Employment' }, { key: 'education', label: 'Education' },
        { key: 'work_shift', label: 'Shift' }, { key: 'address', label: 'Address' }, { key: 'doj', label: 'Joined' },
        { key: 'salary', label: 'Salary', num: true }, { key: 'usertype', label: 'User Type' }, { key: 'rfid', label: 'RFID' },
      ],
      onSelect(r) {
        editing = r.id;
        fillForm(form, Object.assign({}, r, { dob: dmyToIso(r.dob), doj: dmyToIso(r.doj) }));
        idInput.readOnly = true;
        $('#e-mode').textContent = `Editing ${r.id} - change fields then press Update`;
      },
    });
    searchBar($('#e-search'), table, {
      options: [['*', 'All fields'], ['id', 'Id'], ['name', 'Name'], ['email', 'Email'], ['employment_type', 'Employment_type'], ['rfid', 'RFID']],
    });

    const load = async () => table.setRows((await api('GET', '/api/employees')).rows);
    const clear = () => {
      resetForm(form);
      idInput.readOnly = false;
      editing = null;
      table.clearSelection();
      $('#e-mode').textContent = '';
    };
    const payload = () => {
      const d = readForm(form);
      d.dob = isoToDmy(d.dob);
      d.doj = isoToDmy(d.doj);
      return d;
    };

    $('#e-add').onclick = async () => {
      if (await act(api('POST', '/api/employees', payload()))) { clear(); load(); }
    };
    $('#e-update').onclick = async () => {
      if (!editing) return toast('Select an employee in the table first', 'error');
      if (await act(api('PUT', `/api/employees/${encodeURIComponent(editing)}`, payload()))) { clear(); load(); }
    };
    $('#e-delete').onclick = async () => {
      if (!editing) return toast('Select an employee in the table first', 'error');
      if (!(await confirmBox(`Do you want to delete employee ${editing}?`, 'Delete'))) return;
      if (await act(api('DELETE', `/api/employees/${encodeURIComponent(editing)}`))) { clear(); load(); }
    };
    $('#e-clear').onclick = clear;
    $('#e-export').onclick = () => download(`employees_${today()}.csv`, toCSV(table.view, table.columns));

    /* RFID capture: ask the reader over UDP, then poll for the card (non-blocking) */
    $('#e-rfid').onclick = async () => {
      const btn = $('#e-rfid');
      const r = await act(api('POST', '/api/rfid/capture'), '');
      if (!r) return;
      toast('Please tap the RFID card on the reader');
      btn.disabled = true;
      let left = 30;
      const tick = setInterval(async () => {
        left--;
        btn.textContent = `Waiting… ${left}s`;
        try {
          const res = await api('GET', `/api/rfid/last?since=${r.since}`);
          if (res.rfid) {
            clearInterval(tick);
            form.elements.rfid.value = res.rfid;
            toast(`RFID captured: ${res.rfid}`, 'success');
            done();
          }
        } catch (e) { /* keep waiting */ }
        if (left <= 0) { clearInterval(tick); toast('No RFID card detected within 30 seconds', 'warn'); done(); }
      }, 1000);
      const done = () => { btn.disabled = false; btn.textContent = '📡 Capture RFID'; };
      App.cleanup.push(() => clearInterval(tick));
    };

    await load();
  },
});

</script>
<script>/* ===== suppliers ===== */

registerPage('suppliers', {
  title: 'Suppliers',
  module: 'suppliers',
  async render(el) {
    el.innerHTML = `
      <div class="page-head"><div><h1>🚚 Supplier Management</h1><div class="sub">Purchase receipts and delivery tracking</div></div>
        <div class="actions"><button class="btn purple" id="s-analytics">📈 Supplier Analytics</button></div></div>

        <form id="s-form" autocomplete="off">
          <div class="form-grid">

            ${field('name', 'Product Name', { required: true })}
            ${field('category', 'Category', { type: 'select', options: [], required: true })}
            ${field('supplier', 'Supplier', { required: true, list: 's-sup-list' })}
            ${field('contact', 'Contact Number', { required: true })}
            ${field('order_date', 'Order Date', { type: 'date', required: true })}

          </div>
          <datalist id="s-sup-list"></datalist>

            <button type="button" class="btn primary" id="s-update">✏️ Update</button>
            <button type="button" class="btn danger" id="s-delete">🗑️ Delete</button>
            <button type="button" class="btn ghost" id="s-clear">Clear</button>
          </div>
        </form>
      </div>

        <div id="s-table"></div>
        <div class="toolbar" style="margin-top:10px"><button class="btn ghost sm" id="s-export">⬇️ Export CSV</button></div>
      </div>`;

    const form = $('#s-form');
    let editing = null;
    form.elements.order_date.value = today();

    const table = new DataTable($('#s-table'), {
      columns: [
        { key: 'invoice', label: 'Receipt ID', num: true }, { key: 'name', label: 'Product Name' },
        { key: 'category', label: 'Category' }, { key: 'supplier', label: 'Supplier' },
        { key: 'contact', label: 'Contact' }, { key: 'description', label: 'Description' },
        { key: 'order_date', label: 'Order Date' }, { key: 'received_date', label: 'Received Date',
          render: r => r.received_date ? esc(r.received_date) : '<span class="badge gray">Pending</span>' },
      ],
      onSelect(r) {
        editing = r.invoice;
        fillForm(form, r);
        form.elements.invoice.readOnly = true;
        $('#s-mode').textContent = `Editing receipt ${r.invoice}`;
      },
    });
    searchBar($('#s-search'), table, { options: [['*', 'All fields'], ['invoice', 'Receipt ID'], ['name', 'Product Name'], ['supplier', 'Supplier Name']] });

    const load = async () => {
      const [s, c] = await Promise.all([api('GET', '/api/suppliers'), api('GET', '/api/categories')]);
      table.setRows(s.rows);
      setOptions(form.elements.category, c.rows.map(x => x.name));
      $('#s-sup-list').innerHTML = [...new Set(s.rows.map(r => r.supplier))].map(v => `<option value="${esc(v)}">`).join('');
    };
    const clear = () => {
      resetForm(form);
      form.elements.order_date.value = today();
      form.elements.invoice.readOnly = false;
      editing = null;
      table.clearSelection();
      $('#s-mode').textContent = '';
    };

    $('#s-add').onclick = async () => { if (await act(api('POST', '/api/suppliers', readForm(form)))) { clear(); load(); } };
    $('#s-update').onclick = async () => {
      if (!editing) return toast('Select a row in the table first', 'error');
      if (await act(api('PUT', `/api/suppliers/${encodeURIComponent(editing)}`, readForm(form)))) { clear(); load(); }
    };
    $('#s-delete').onclick = async () => {
      if (!editing) return toast('No row selected', 'error');
      if (!(await confirmBox('Delete this supplier?', 'Delete'))) return;
      if (await act(api('DELETE', `/api/suppliers/${encodeURIComponent(editing)}`))) { clear(); load(); }
    };
    $('#s-clear').onclick = clear;
    $('#s-export').onclick = () => download(`suppliers_${today()}.csv`, toCSV(table.view, table.columns));

    $('#s-analytics').onclick = () => {
      const perf = {};
      let total = 0, delivered = 0, days = 0;
      table.rows.forEach(r => {
        const p = perf[r.supplier || 'Unknown'] ||= { total: 0, delivered: 0, days: 0 };
        p.total++; total++;
        const od = parseAnyDate(r.order_date), rd = parseAnyDate(r.received_date);
        if (od && rd) {
          const d = Math.round((rd - od) / 86400000);
          p.delivered++; p.days += d; delivered++; days += d;
        }
      });
      if (!total) return toast('No supplier data available for analytics');
      const rows = Object.entries(perf).map(([name, p]) => `<tr><td>${esc(name)}</td><td class="num">${p.total}</td><td class="num">${p.delivered}</td>
        <td class="num">${(p.delivered / p.total * 100).toFixed(1)}%</td><td class="num">${p.delivered ? (p.days / p.delivered).toFixed(1) : 'N/A'}</td></tr>`).join('');
      modal({
        title: 'Supplier Performance Analytics', wide: true,
        html: `<div class="stats">
            <div class="stat"><div class="label">Total orders</div><div class="value">${total}</div></div>
            <div class="stat" style="--accent:#27AE60"><div class="label">Delivered</div><div class="value">${delivered}</div></div>
            <div class="stat" style="--accent:#F39C12"><div class="label">Avg delivery</div><div class="value">${delivered ? (days / delivered).toFixed(1) : '–'} <small>days</small></div></div>
          </div>
          <div class="chart-box"><canvas id="s-an-chart"></canvas></div>
          <div class="table-wrap" style="margin-top:14px"><table class="data"><thead><tr><th>Supplier</th><th>Total Orders</th><th>Delivered</th><th>Delivery Rate</th><th>Avg Delivery Days</th></tr></thead><tbody>${rows}</tbody></table></div>`,
        onOpen: back => {
          const names = Object.keys(perf);
          chart($('#s-an-chart', back), {
            type: 'bar',
            data: { labels: names, datasets: [
              { label: 'Total orders', data: names.map(n => perf[n].total), backgroundColor: Theme.alt },
              { label: 'Delivered', data: names.map(n => perf[n].delivered), backgroundColor: Theme.ink },
            ] },
            options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
          });
        },
      });
    };

    await load();
  },
});

</script>

          <h3>Category details <span class="editing-note" id="c-mode"></span></h3>
          <form id="c-form" autocomplete="off">
            <div class="form-grid" style="grid-template-columns:1fr 2fr">
              ${field('id', 'Category ID', { type: 'number', required: true, min: 0 })}
              ${field('name', 'Category Name', { required: true, placeholder: 'e.g. Polo T-Shirt' })}
              ${field('description', 'Description', { type: 'textarea', cls: 'full', rows: 4, required: true })}
            </div>
            <div class="form-actions">
              <button type="button" class="btn success" id="c-add">➕ Add</button>
              <button type="button" class="btn primary" id="c-update">✏️ Update</button>
              <button type="button" class="btn danger" id="c-delete">🗑️ Delete</button>
              <button type="button" class="btn ghost" id="c-clear">Clear</button>
            </div>
          </form>
          <p class="sub" style="color:var(--muted);font-size:12px;margin-top:16px">
            Tip: for automatic material deduction in Products, name categories like the consumption table
            (Polo T-Shirt, Formal Shirt, Casual Shirt, Shorts, Leggings, Sports Bra, Pants, Jacket, Track Suit, Crew Neck).</p>
        </div>
        <div class="card">
          <div class="toolbar" id="c-search"></div>
          <div id="c-table"></div>
        </div>
      </div>`;

    const form = $('#c-form');
    let editing = null;
    const table = new DataTable($('#c-table'), {
      columns: [{ key: 'id', label: 'Category ID', num: true }, { key: 'name', label: 'Category Name' }, { key: 'description', label: 'Description' }],
      onSelect(r) {
        editing = r.id;
        fillForm(form, r);
        form.elements.id.readOnly = true;
        $('#c-mode').textContent = `Editing category ${r.id}`;
      },
    });
    searchBar($('#c-search'), table, { options: [['*', 'All fields'], ['id', 'Category Id'], ['name', 'Category Name']] });

    const load = async () => table.setRows((await api('GET', '/api/categories')).rows);
    const clear = () => { resetForm(form); form.elements.id.readOnly = false; editing = null; table.clearSelection(); $('#c-mode').textContent = ''; };

    $('#c-add').onclick = async () => { if (await act(api('POST', '/api/categories', readForm(form)))) { clear(); load(); } };
    $('#c-update').onclick = async () => {
      if (!editing) return toast('Select a category first', 'error');
      if (await act(api('PUT', `/api/categories/${encodeURIComponent(editing)}`, readForm(form)))) { clear(); load(); }
    };
    $('#c-delete').onclick = async () => {
      if (!editing) return toast('No row selected', 'error');
      if (!(await confirmBox('Delete this category?', 'Delete'))) return;
      if (await act(api('DELETE', `/api/categories/${encodeURIComponent(editing)}`))) { clear(); load(); }
    };
    $('#c-clear').onclick = clear;
    await load();
  },
});

</script>
<script>/* ===== products ===== */
/* Product management (productsn.py) */
'use strict';

const SIZES = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
const ACCESSORY_FIELDS = [
  ['needles_used', 'Needles (pcs)', 'needles'], ['threads_used', 'Threads (spools)', 'threads'],
  ['twill_tape_used', 'Twill Tape (m)', 'twill_tape'], ['zippers_used', 'Zippers (pcs)', 'zippers'],
  ['elastic_used', 'Elastic (m)', 'elastic'],
];

function ratioKey(text, keys) {
  const n = norm(text);
  return keys.find(k => norm(k) === n) || String(text || '').toLowerCase().replace(/[ -]/g, '_');
}

registerPage('products', {
  title: 'Products',
  module: 'products',
  async render(el) {
    el.innerHTML = `
      <div class="page-head"><div><h1>👕 Product Management Portal</h1>
        <div class="sub">Adding a product deducts fabric and accessories from Raw Materials automatically</div></div>
        <div class="actions"><input id="p-scan" placeholder="🔍 Scan barcode here…" style="padding:8px 10px;border:1px solid #CCD4DD;border-radius:7px;min-width:240px"></div>
      </div>
      <div class="card">
        <h3>Product Information <span class="editing-note" id="p-mode"></span></h3>
        <form id="p-form" autocomplete="off">
          <div class="form-grid">
            ${field('invoice', 'Product ID', { type: 'number', required: true, min: 0 })}
            ${field('name', 'Product Name', { required: true })}
            ${field('category', 'Size', { type: 'select', options: SIZES, required: true })}
            ${field('supplier', 'Customer Name', { required: true })}
            ${field('contact', 'Raw Material', { type: 'select', options: [], required: true })}
            ${field('product_category', 'Category', { type: 'select', options: [], required: true })}
            ${field('quantity', 'Quantity', { type: 'number', required: true, min: 1, value: '1' })}
            ${field('damaged', 'Damaged', { type: 'checkbox' })}
          </div>
          <h3 style="margin-top:20px">Other Raw Materials Used <span class="right">auto-calculated from Category × Quantity - you can override</span></h3>
          <div class="form-grid">
            ${ACCESSORY_FIELDS.map(([n, l]) => field(n, l, { type: 'number', step: '0.01', min: 0, value: '0' })).join('')}
          </div>
          <div id="p-fabric-note" class="help" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
          <div class="form-actions">
            <button type="button" class="btn success" id="p-add">➕ Add Product</button>
            <button type="button" class="btn primary" id="p-update">✏️ Update Product</button>
            <button type="button" class="btn warning" id="p-damaged">⚠️ Mark as Damaged</button>
            <button type="button" class="btn danger" id="p-delete">🗑️ Delete Product</button>
            <button type="button" class="btn ghost" id="p-clear">Clear Fields</button>
            <button type="button" class="btn ghost" id="p-ratios">ℹ️ Consumption table</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h3>Product Database</h3>
        <div class="toolbar" id="p-search"></div>
        <div id="p-table"></div>
        <div class="toolbar" style="margin-top:10px"><button class="btn ghost sm" id="p-export">⬇️ Export CSV</button></div>
      </div>`;

    const form = $('#p-form');
    const F = form.elements;
    let meta = { accessory_ratios: {}, fabric_ratios: {}, category_mapping: {} };
    let editing = null;

    const table = new DataTable($('#p-table'), {
      columns: [
        { key: 'invoice', label: 'Product ID', num: true }, { key: 'name', label: 'Name' }, { key: 'category', label: 'Size' },
        { key: 'supplier', label: 'Customer' }, { key: 'contact', label: 'Raw Material' }, { key: 'product_category', label: 'Category' },
        { key: 'quantity', label: 'Qty', num: true },
        ...ACCESSORY_FIELDS.map(([k, l]) => ({ key: k, label: l.split(' ')[0] === 'Twill' ? 'Twill' : l.split(' ')[0], num: true, render: r => fmt(r[k], 2) })),
        { key: 'damaged', label: 'Damaged', value: r => r.damaged ? 'Yes' : 'No',
          render: r => r.damaged ? '<span class="badge red">Yes</span>' : '<span class="badge green">No</span>' },
      ],
      onSelect(r) {
        editing = r.key;
        fillForm(form, r);
        $('#p-mode').textContent = `Editing product ${r.invoice}`;
        updateFabricNote();
      },
    });
    searchBar($('#p-search'), table, { options: [['*', 'All fields'], ['invoice', 'Product ID'], ['name', 'Product Name'], ['supplier', 'Customer']] });

    const mappedCategory = () => {
      const keys = [...Object.keys(meta.category_mapping), ...Object.keys(meta.accessory_ratios.needles || {})];
      const k = ratioKey(F.product_category.value, keys);
      return meta.category_mapping[k] || k;
    };
    const updateFabricNote = () => {
      const cat = mappedCategory();
      const fab = ratioKey(F.contact.value, Object.keys(meta.fabric_ratios));
      const per = meta.fabric_ratios[fab]?.[cat];
      const q = num(F.quantity.value);
      $('#p-fabric-note').textContent = !F.contact.value || !F.product_category.value ? ''
        : per ? `Fabric: ${q} × ${per} kg of ${F.contact.value} = ${(q * per).toFixed(2)} kg will be deducted.`
          : `No fabric ratio for ${F.contact.value} → ${F.product_category.value}; only accessories will be deducted.`;
    };
    const autoAccessories = () => {
      const cat = mappedCategory();
      const q = num(F.quantity.value);
      ACCESSORY_FIELDS.forEach(([f, , acc]) => {
        const per = meta.accessory_ratios[acc]?.[cat];
        F[f].value = per ? (per * q).toFixed(2) : '0';
      });
      updateFabricNote();
    };
    F.product_category.onchange = autoAccessories;
    F.quantity.oninput = autoAccessories;
    F.contact.onchange = updateFabricNote;

    const load = async () => {
      const r = await api('GET', '/api/products');
      meta = r;
      table.setRows(r.rows);
      setOptions(F.contact, r.materials);
      setOptions(F.product_category, r.categories);
    };
    const clear = () => {
      resetForm(form);
      editing = null;
      table.clearSelection();
      $('#p-mode').textContent = '';
      $('#p-fabric-note').textContent = '';
    };

    $('#p-add').onclick = async () => {
      if (await act(api('POST', '/api/products', readForm(form)))) { clear(); load(); }
    };
    $('#p-update').onclick = async () => {
      if (!editing) return toast('No product selected.', 'error');
      if (await act(api('PUT', `/api/products/${encodeURIComponent(editing)}`, readForm(form)))) { clear(); load(); }
    };
    $('#p-damaged').onclick = async () => {
      if (!editing) return toast('No row selected', 'error');
      if (await act(api('POST', `/api/products/${encodeURIComponent(editing)}/damaged`))) { clear(); load(); }
    };
    $('#p-delete').onclick = async () => {
      if (!editing) return toast('No row selected', 'error');
      if (!(await confirmBox('Do you want to delete this product?', 'Delete'))) return;
      if (await act(api('DELETE', `/api/products/${encodeURIComponent(editing)}`))) { clear(); load(); }
    };
    $('#p-clear').onclick = clear;
    $('#p-export').onclick = () => download(`products_${today()}.csv`, toCSV(table.view, table.columns));

    $('#p-ratios').onclick = () => {
      const fab = Object.entries(meta.fabric_ratios).map(([m, r]) =>
        `<tr><td><b>${esc(m)}</b></td><td>${Object.entries(r).map(([c, v]) => `${esc(c)} = ${v} kg`).join(', ')}</td></tr>`).join('');
      const acc = Object.entries(meta.accessory_ratios).map(([m, r]) =>
        `<tr><td><b>${esc(m)}</b></td><td>${Object.entries(r).filter(([, v]) => v).map(([c, v]) => `${esc(c)} = ${v}`).join(', ')}</td></tr>`).join('');
      modal({
        title: 'Material Consumption Info (per piece)', wide: true,
        html: `<h4>Fabric (kg per piece)</h4><div class="table-wrap"><table class="data"><tbody>${fab}</tbody></table></div>
          <h4>Accessories (units per piece)</h4><div class="table-wrap"><table class="data"><tbody>${acc}</tbody></table></div>
          <p class="help" style="font-size:12px;color:var(--muted)">Category aliases: ${esc(Object.entries(meta.category_mapping).map(([a, b]) => `${a} → ${b}`).join(', '))}</p>`,
      });
    };

    /* Barcode scanner (keyboard wedge): ID|Name|Size|Customer|Material|Category|Quantity */
    $('#p-scan').addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const parts = e.target.value.trim().split('|');
      if (parts.length !== 7) { toast(`Barcode should have 7 parts separated by |, got ${parts.length}`, 'error'); return; }
      clear();
      const [invoice, name, size, customer, material, category, quantity] = parts;
      fillForm(form, { invoice, name, category: size, supplier: customer, contact: material, product_category: category, quantity });
      autoAccessories();
      e.target.value = '';
      toast('Form filled from barcode', 'success');
    });

    await load();
  },
});

</script>
<script>/* ===== sales ===== */
/* Sales (sales.py) */
'use strict';

registerPage('sales', {
  title: 'Sales',
  module: 'sales',
  async render(el) {
    el.innerHTML = `
      <div class="page-head"><div><h1>💰 Sales</h1><div class="sub">Record sales, print invoices and track performance</div></div></div>
      <div class="tabs">
        <button class="tab active" data-tab="new">🧾 New Sale Entry</button>
        <button class="tab" data-tab="records">📋 Sales Records</button>
        <button class="tab" data-tab="perf">📈 Sales Performance</button>
      </div>

      <div class="tab-panel active" data-tab="new">
        <form id="sa-form" autocomplete="off">
          <div class="card"><h3>Product Details</h3><div class="form-grid">
            ${field('product_name', 'Product Name', { type: 'select', options: [], required: true })}
            ${field('sku', 'Product ID', { required: true })}
            ${field('category', 'Category', { type: 'select', options: [] })}
            ${field('size', 'Size', { type: 'select', options: SIZES })}
            ${field('description', 'Description', { type: 'textarea', cls: 'wide' })}
          </div></div>
          <div class="card"><h3>Pricing & Discounts</h3><div class="form-grid">
            ${field('unit_price', 'Unit Price (Rs)', { type: 'number', step: '0.01', min: 0, required: true })}
            ${field('bulk_price', 'Quantity', { type: 'number', min: 0, value: '1' })}
            ${field('discount', 'Discount (%)', { type: 'number', step: '0.01', min: 0, value: '0' })}
            ${field('final_price', 'Final Price (per unit)', { readonly: true })}
            ${field('total_amount', 'Total Amount', { readonly: true })}
          </div></div>
          <div class="card"><h3>Customer & Order Details</h3><div class="form-grid">
            ${field('customer_name', 'Customer Name', { required: true })}
            ${field('customer_contact', 'Customer Contact')}
            ${field('order_id', 'Order ID', { required: true })}
            ${field('order_date', 'Order Date', { type: 'date' })}
            ${field('payment_method', 'Payment Method', { type: 'select', options: ['Cash', 'Cheque', 'Card'] })}
            ${field('billing_address', 'Billing Address', { type: 'textarea' })}
            ${field('shipping_address', 'Shipping Address', { type: 'textarea' })}
          </div></div>
          <div class="card"><h3>Transaction Details</h3><div class="form-grid">
            ${field('invoice_number', 'Invoice Number')}
            ${field('payment_status', 'Payment Status', { type: 'select', options: ['Done', 'Not done', 'Credit'] })}
            ${field('cash_given', 'Cash Received (optional)', { type: 'number', step: '0.01', min: 0, help: 'Fills Change Given automatically' })}
            ${field('change_given', 'Change Given', { type: 'number', step: '0.01' })}
            ${field('salesperson_name', 'Salesperson Name')}
          </div>
          <div class="form-actions"><button type="button" class="btn primary" id="sa-add">💾 Add Sale</button>
            <button type="button" class="btn ghost" id="sa-clear">Clear</button></div></div>
        </form>
      </div>

      <div class="tab-panel" data-tab="records">
        <div class="card">
          <div class="toolbar" id="sa-search"></div>
          <div id="sa-table"></div>
          <div class="form-actions">
            <button class="btn primary" id="sa-invoice">🧾 Print Invoice</button>
            <button class="btn ghost" id="sa-view">👁️ View details</button>
            <button class="btn danger" id="sa-delete">🗑️ Delete</button>
            <button class="btn ghost" id="sa-export">⬇️ Export CSV</button>
          </div>
        </div>
      </div>

      <div class="tab-panel" data-tab="perf">
        <div class="card highlight"><h3 id="sa-month" style="margin:0"></h3></div>
        <div class="stats" id="sa-stats"></div>
        <div class="grid cols-2">
          <div class="card"><h3>Daily Sales (recent 15 days)</h3><div class="chart-box"><canvas id="sa-c-daily"></canvas></div></div>
          <div class="card"><h3>Monthly Sales Trend</h3><div class="chart-box"><canvas id="sa-c-trend"></canvas></div></div>
          <div class="card"><h3>Sales by Product</h3><div class="chart-box"><canvas id="sa-c-prod"></canvas></div></div>
          <div class="card"><h3>Monthly Comparison</h3><div class="chart-box"><canvas id="sa-c-month"></canvas></div></div>
        </div>
        <div class="form-actions">
          <button class="btn primary" id="sa-report">📄 Monthly Report</button>
          <button class="btn ghost" id="sa-export-month">⬇️ Export Monthly Data</button>
        </div>
      </div>`;

    const form = $('#sa-form');
    const F = form.elements;
    let products = [];
    let sales = [];
    const showTab = tabs(el, t => { if (t === 'perf') drawPerformance(); });

    const resetSaleForm = () => {
      resetForm(form);
      F.order_date.value = today();
      F.salesperson_name.value = App.user.name || '';
      recalc();
    };
    const recalc = () => {
      const unit = num(F.unit_price.value), disc = num(F.discount.value), qty = num(F.bulk_price.value);
      const final = unit - unit * disc / 100;
      F.final_price.value = final.toFixed(2);
      F.total_amount.value = (final * qty).toFixed(2);
      if (F.cash_given.value) F.change_given.value = Math.max(0, num(F.cash_given.value) - final * qty).toFixed(2);
    };
    ['unit_price', 'discount', 'bulk_price', 'cash_given'].forEach(n => F[n].addEventListener('input', recalc));

    F.product_name.onchange = () => {
      const p = products.find(x => x.name === F.product_name.value);
      if (!p) return;
      F.sku.value = p.invoice ?? '';
      if (p.product_category) setSelect(F.category, p.product_category);
      if (p.category) setSelect(F.size, p.category);
      if (p.supplier) F.customer_name.value = p.supplier;
      if (p.price) F.unit_price.value = p.price;
      if (p.description) F.description.value = p.description;
      recalc();
    };

    $('#sa-add').onclick = async () => {
      const d = readForm(form);
      delete d.cash_given;
      if (await act(api('POST', '/api/sales', d))) { resetSaleForm(); loadSales(); }
    };
    $('#sa-clear').onclick = resetSaleForm;

    const table = new DataTable($('#sa-table'), {
      columns: [
        { key: 'id', label: 'Sale ID' }, { key: 'invoice_number', label: 'Invoice' }, { key: 'sku', label: 'Product ID' },
        { key: 'product_name', label: 'Product' }, { key: 'order_id', label: 'Order ID' }, { key: 'order_date', label: 'Date' },
        { key: 'customer_name', label: 'Customer' }, { key: 'payment_status', label: 'Status' },
        { key: 'total_amount', label: 'Total (Rs)', num: true, render: r => fmt(r.total_amount) },
      ],
      onDblClick: r => viewSale(r),
    });
    searchBar($('#sa-search'), table, { options: [['*', 'All fields'], ['product_name', 'Product'], ['order_id', 'Order ID'], ['customer_name', 'Customer'], ['order_date', 'Date']] });

    const needSel = () => { if (!table.selected) toast('Please select a sale record first.', 'error'); return table.selected; };
    const viewSale = r => modal({
      title: `Sale ${r.invoice_number || r.id}`, wide: true,
      html: `<div class="kv">${Object.entries(r).map(([k, v]) => `<b>${esc(k.replace(/_/g, ' '))}</b><span>${esc(v)}</span>`).join('')}</div>`,
    });
    $('#sa-invoice').onclick = () => { const r = needSel(); if (r) openInvoice(r); };
    $('#sa-view').onclick = () => { const r = needSel(); if (r) viewSale(r); };
    $('#sa-delete').onclick = async () => {
      const r = needSel();
      if (!r || !(await confirmBox('Do you want to delete this record?', 'Delete'))) return;
      if (await act(api('DELETE', `/api/sales/${encodeURIComponent(r.id)}`))) loadSales();
    };
    $('#sa-export').onclick = () => download(`sales_${today()}.csv`, toCSV(table.view, table.columns));

    /* ---------- analytics (same maths as fetch_daily/monthly/product_sales) ---------- */
    const monthly = () => {
      const m = {};
      sales.forEach(s => { const k = String(s.order_date || '').slice(0, 7); if (/^\d{4}-\d{2}$/.test(k)) m[k] = (m[k] || 0) + num(s.total_amount); });
      const keys = Object.keys(m).sort();
      return { keys, labels: keys.map(k => `${MONTHS[+k.slice(5) - 1]} ${k.slice(0, 4)}`), totals: keys.map(k => m[k]) };
    };

    function drawPerformance() {
      const now = new Date();
      const curKey = today().slice(0, 7);
      const cur = sales.filter(s => String(s.order_date).startsWith(curKey)).reduce((a, s) => a + num(s.total_amount), 0);
      $('#sa-month').textContent = `Current Month (${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}) Total: Rs ${fmt(cur)}`;
      const total = sales.reduce((a, s) => a + num(s.total_amount), 0);
      const mo = monthly();
      $('#sa-stats').innerHTML = `
        <div class="stat"><div class="label">Total Sales</div><div class="value" style="font-size:22px">Rs ${fmt(total, 0)}</div></div>
        <div class="stat" style="--accent:#27AE60"><div class="label">Transactions</div><div class="value">${sales.length}</div></div>
        <div class="stat" style="--accent:#F39C12"><div class="label">Avg Transaction</div><div class="value" style="font-size:22px">Rs ${fmt(sales.length ? total / sales.length : 0, 0)}</div></div>
        <div class="stat" style="--accent:#9B59B6"><div class="label">Avg Monthly</div><div class="value" style="font-size:22px">Rs ${fmt(mo.totals.length ? total / mo.totals.length : 0, 0)}</div></div>
        <div class="stat" style="--accent:#16A085"><div class="label">Months Tracked</div><div class="value">${mo.totals.length}</div></div>`;

      const daily = {};
      sales.forEach(s => { if (s.order_date) daily[s.order_date] = (daily[s.order_date] || 0) + num(s.total_amount); });
      const dk = Object.keys(daily).sort().slice(-15);
      const dc = $('#sa-c-daily');
      if (!dk.length) emptyChart(dc, 'No sales yet'); else {
        showCanvas(dc);
        chart(dc, { type: 'bar', data: { labels: dk.map(k => k.slice(5)), datasets: [{ label: 'Rs', data: dk.map(k => daily[k]), backgroundColor: Theme.ink, borderRadius: 4 }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
      }
      const last12 = { labels: mo.labels.slice(-12), totals: mo.totals.slice(-12) };
      const tc = $('#sa-c-trend'), mc = $('#sa-c-month');
      if (!last12.labels.length) { emptyChart(tc, 'No monthly data'); emptyChart(mc, 'No monthly data'); } else {
        showCanvas(tc); showCanvas(mc);
        chart(tc, { type: 'line', data: { labels: last12.labels, datasets: [{ label: 'Monthly sales (Rs)', data: last12.totals, borderColor: Theme.ink, backgroundColor: Theme.soft, fill: true, tension: .3, pointRadius: 4 }] },
          options: { scales: { y: { beginAtZero: true } } } });
        chart(mc, { type: 'bar', data: { labels: last12.labels, datasets: [{ label: 'Rs', data: last12.totals, backgroundColor: Theme.ink, borderRadius: 4 }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
      }
      const byProd = {};
      sales.forEach(s => { const k = s.product_name || 'Unknown Product'; byProd[k] = (byProd[k] || 0) + num(s.total_amount); });
      const pc = $('#sa-c-prod');
      if (!Object.keys(byProd).length) emptyChart(pc, 'No product sales'); else {
        showCanvas(pc);
        chart(pc, { type: 'pie', data: { labels: Object.keys(byProd), datasets: [{ data: Object.values(byProd), backgroundColor: PALETTE }] },
          options: { plugins: { legend: { position: 'right' } } } });
      }
    }

    $('#sa-report').onclick = () => {
      const now = new Date();
      const mo = monthly();
      const curKey = today().slice(0, 7);
      const cur = sales.filter(s => String(s.order_date).startsWith(curKey)).reduce((a, s) => a + num(s.total_amount), 0);
      let t = `MONTHLY SALES REPORT\n${'='.repeat(50)}\n\nReport Generated: ${today()}\nCurrent Month: ${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}\nCurrent Month Total: Rs${cur.toFixed(2)}\n\n`;
      if (mo.totals.length) {
        const all = mo.totals.reduce((a, b) => a + b, 0);
        t += `MONTHLY BREAKDOWN:\n${'-'.repeat(30)}\n`;
        mo.labels.forEach((l, i) => { t += `${l.padEnd(15)} Rs${mo.totals[i].toFixed(2).padStart(12)} (${(all ? mo.totals[i] / all * 100 : 0).toFixed(1).padStart(5)}%)\n`; });
        t += `${'-'.repeat(30)}\n${'TOTAL'.padEnd(15)} Rs${all.toFixed(2).padStart(12)} (100.0%)\n\n`;
        if (mo.totals.length > 1) {
          const best = mo.totals.indexOf(Math.max(...mo.totals)), worst = mo.totals.indexOf(Math.min(...mo.totals));
          const a = mo.totals.at(-1), b = mo.totals.at(-2);
          t += `ANALYTICS:\n${'-'.repeat(20)}\nAverage Monthly Sales: Rs${(all / mo.totals.length).toFixed(2)}\n`;
          t += `Best Month: ${mo.labels[best]} (Rs${mo.totals[best].toFixed(2)})\nLowest Month: ${mo.labels[worst]} (Rs${mo.totals[worst].toFixed(2)})\n`;
          t += `Month-over-Month Growth: ${b ? ((a - b) / b * 100 >= 0 ? '+' : '') + ((a - b) / b * 100).toFixed(1) : '0.0'}%\n`;
        }
      } else t += 'No monthly sales data available.\n';
      showReport('Monthly Sales Report', t, `monthly_sales_report_${today()}.txt`);
    };
    $('#sa-export-month').onclick = () => {
      const mo = monthly();
      download(`monthly_sales_${today()}.csv`, toCSV(mo.labels.map((l, i) => ({ month: l, total: mo.totals[i].toFixed(2) })),
        [{ key: 'month', label: 'Month' }, { key: 'total', label: 'Total Sales (Rs)' }]));
    };

    const loadSales = async () => {
      sales = (await api('GET', '/api/sales')).rows;
      table.setRows(sales);
      if ($('.tab[data-tab=perf]').classList.contains('active')) drawPerformance();
    };
    const [p, c] = await Promise.all([api('GET', '/api/products'), api('GET', '/api/categories')]);
    products = p.rows;
    setOptions(F.product_name, [...new Set(products.map(x => x.name))]);
    setOptions(F.category, c.rows.map(x => x.name));
    resetSaleForm();
    await loadSales();

    if (!canUse('sales')) showTab('records');
  },
});

</script>
<script>/* ===== barcode ===== */
/* Barcode generator (Barcode.py) - Code128, format ID|Name|Size|Customer|Material|Category|Quantity */
'use strict';

registerPage('barcode', {
  title: 'Barcode',
  module: 'barcode',
  async render(el) {
    el.innerHTML = `
      <div class="page-head"><div><h1>🏷️ Barcode Generator Portal</h1>
        <div class="sub">Barcode contains: ID|Name|Size|Customer|Material|Category|Quantity</div></div></div>
      <div class="grid cols-2">
        <div class="card">
          <h3>Product Information</h3>
          <form id="b-form" autocomplete="off">
            <div class="form-grid" style="grid-template-columns:1fr 1fr">
              ${field('product_id', 'Product ID', { required: true })}
              ${field('name', 'Product Name', { required: true })}
              ${field('size', 'Size', { type: 'select', options: SIZES, required: true })}
              ${field('customer', 'Customer Name', { type: 'select', options: [], required: true })}
              ${field('material', 'Raw Materials', { type: 'select', options: [], required: true })}
              ${field('category', 'Category', { type: 'select', options: [], required: true })}
              ${field('quantity', 'Quantity', { type: 'number', min: 1, required: true })}
              ${field('bsize', 'Barcode Size', { type: 'select', options: [['standard', 'Standard (57x32mm)'], ['small', 'Small (40x22mm)'], ['large', 'Large (75x42mm)']], placeholder: 'Standard' })}
            </div>
            <div class="form-actions">
              <button type="button" class="btn success" id="b-gen">🏷️ Generate Barcode Image</button>
              <button type="button" class="btn ghost" id="b-clear">Clear Fields</button>
              <button type="button" class="btn ghost" id="b-refresh">↻ Refresh lists</button>
            </div>
          </form>
        </div>
        <div class="card">
          <h3>Preview</h3>
          <div class="barcode-preview" id="b-preview"><div class="empty">Fill in the form and press Generate</div></div>
          <div class="form-actions">
            <button class="btn primary" id="b-download" disabled>⬇️ Download PNG</button>
            <button class="btn ghost" id="b-print" disabled>🖨️ Print label</button>
          </div>
          <div class="help" id="b-status" style="font-size:12px;color:var(--muted);margin-top:8px">Status: Ready</div>
        </div>
      </div>
      <div class="card">
        <h3>Generated barcodes</h3>
        <div class="toolbar" id="b-search"></div>
        <div id="b-table"></div>
        <p class="help" style="font-size:12px;color:var(--muted)">Click a row to load it back into the form.</p>
      </div>`;

    const form = $('#b-form');
    const F = form.elements;
    let lastCanvas = null, lastId = '';

    const table = new DataTable($('#b-table'), {
      columns: [
        { key: 'product_id', label: 'Product ID' }, { key: 'name', label: 'Name' }, { key: 'size', label: 'Size' },
        { key: 'customer', label: 'Customer' }, { key: 'material', label: 'Material' }, { key: 'category', label: 'Category' },
        { key: 'quantity', label: 'Qty', num: true }, { key: 'timestamp', label: 'Saved' },
      ],
      onSelect: r => fillForm(form, r),
    });
    searchBar($('#b-search'), table, { options: [['*', 'All fields'], ['product_id', 'Product ID'], ['name', 'Name'], ['customer', 'Customer']] });

    const load = async () => {
      const r = await api('GET', '/api/barcodes');
      table.setRows(r.rows);
      setOptions(F.customer, r.customers);
      setOptions(F.material, r.materials);
      setOptions(F.category, r.categories);
      if (r.error) toast(`Could not read saved barcodes: ${r.error}`, 'warn');
    };

    const draw = (data, pid, sizeOpt) => {
      const s = { small: [1, 45, 12], large: [3, 110, 20], standard: [2, 70, 16] }[sizeOpt || 'standard'];
      const bar = document.createElement('canvas');
      JsBarcode(bar, data, { format: 'CODE128', width: s[0], height: s[1], margin: 12, displayValue: false });
      const out = document.createElement('canvas');
      const fontPx = Math.max(s[2], Math.round(bar.width / 28));   // keep the ID readable on long barcodes
      out.width = bar.width;
      out.height = bar.height + fontPx + 16;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(bar, 0, 0);
      ctx.fillStyle = '#000';
      ctx.font = `bold ${fontPx}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(pid, out.width / 2, bar.height + fontPx + 2);
      return out;
    };

    $('#b-gen').onclick = async () => {
      const d = readForm(form);
      if (!d.product_id) return toast('Product ID is required to generate a barcode', 'error');
      if (/\|/.test(Object.values(d).join(''))) return toast('Fields must not contain the | character', 'error');
      const r = await act(api('POST', '/api/barcodes', d), '');
      if (!r) return;
      try {
        lastCanvas = draw(r.barcode_data, d.product_id, d.bsize);
      } catch (e) {
        return toast(`Barcode error: ${e.message || e}`, 'error');
      }
      lastId = d.product_id;
      const box = $('#b-preview');
      box.innerHTML = '';
      box.appendChild(lastCanvas);
      $('#b-download').disabled = $('#b-print').disabled = false;
      $('#b-status').textContent = `Status: Barcode generated and saved. Contains: ${r.barcode_data}`;
      toast('Barcode image generated successfully', 'success');
      load();
    };
    $('#b-download').onclick = () => lastCanvas.toBlob(b => download(`barcode_${lastId}.png`, b));
    $('#b-print').onclick = () => {
      const w = window.open('', '_blank');
      if (!w) return toast('Allow pop-ups to print', 'warn');
      w.document.write(`<title>Barcode ${esc(lastId)}</title><body style="margin:0;text-align:center"><img src="${lastCanvas.toDataURL()}" onload="window.print()"></body>`);
      w.document.close();
    };
    $('#b-clear').onclick = () => { resetForm(form); table.clearSelection(); };
    $('#b-refresh').onclick = () => load().then(() => toast('Lists refreshed', 'success'));
    await load();
  },
});

</script>
<script>/* ===== materials ===== */
/* Raw material management (raw_materials.py) */
'use strict';

function lowStockMessage(m) {
  return `LOW STOCK ALERT\n\nMaterial: ${m.material_name}\nCode: ${m.display_code || m.code}\nCurrent Stock: ${m.current_stock}\n` +
    `Minimum Stock: ${m.min_stock}\nStatus: URGENT REORDER NEEDED\n\nPlease restock immediately to avoid production delays.\n\nSent from Inventory Management System`;
}

registerPage('materials', {
  title: 'Raw Materials',
  module: 'materials',
  async render(el) {
    el.innerHTML = `
      <div class="page-head"><div><h1>🧵 Raw Material Management Portal</h1><div class="sub">Red rows are at or below their minimum stock level</div></div>
        <div class="actions">
          <button class="btn primary" id="m-adjust">⚖️ Stock Adjustment</button>
          <button class="btn purple" id="m-impact">🏭 Production Impact</button>
          <button class="btn whatsapp" id="m-bulk">📲 Bulk WhatsApp Alert</button>
        </div></div>
      <div class="card">
        <h3>Raw Material Details <span class="editing-note" id="m-mode"></span></h3>
        <form id="m-form" autocomplete="off">
          <div class="form-grid">
            ${field('code', 'Item Code', { required: true })}
            ${field('material_name', 'Item Name', { required: true })}
            ${field('category', 'Category', { type: 'select', options: [], required: true })}
            ${field('unit_measure', 'Unit of Measure', { type: 'select', options: [], required: true })}
            ${field('current_stock', 'Current Stock', { type: 'number', step: '0.01', min: 0, required: true })}
            ${field('min_stock', 'Min Stock Alert', { type: 'number', step: '0.01', min: 0, required: true })}
            ${field('location', 'Location', { type: 'select', options: [], required: true })}
            ${field('supplier', 'Supplier', { required: true, list: 'm-sup-list' })}
            ${field('phone_number', 'Phone Number', { help: 'Format: 94XXXXXXXXX or 07XXXXXXXX' })}
          </div>
          <datalist id="m-sup-list"></datalist>
          <div class="form-actions">
            <button type="button" class="btn primary" id="m-add">➕ Add Item</button>
            <button type="button" class="btn warning" id="m-update">✏️ Update</button>
            <button type="button" class="btn danger" id="m-delete">🗑️ Delete</button>
            <button type="button" class="btn purple" id="m-clear">Clear</button>
            <button type="button" class="btn whatsapp" id="m-wa">📲 Send WhatsApp Alert</button>
          </div>
        </form>
      </div>
      <div class="card">
        <div class="toolbar" id="m-search"></div>
        <div id="m-table"></div>
        <div class="toolbar" style="margin-top:10px"><button class="btn ghost sm" id="m-export">⬇️ Export CSV</button></div>
      </div>`;

    const form = $('#m-form');
    const F = form.elements;
    let editing = null, meta = {};

    const table = new DataTable($('#m-table'), {
      columns: [
        { key: 'display_code', label: 'Code' }, { key: 'material_name', label: 'Name' }, { key: 'category', label: 'Category' },
        { key: 'unit_measure', label: 'Unit' }, { key: 'current_stock', label: 'Current', num: true, render: r => fmt(r.current_stock) },
        { key: 'allocated', label: 'Allocated', num: true, render: r => fmt(r.allocated) },
        { key: 'available', label: 'Available', num: true, render: r => fmt(r.available) },
        { key: 'min_stock', label: 'Min Stock', num: true, render: r => fmt(r.min_stock) },
        { key: 'status', label: 'Status', render: r => `<span class="badge ${r.low ? 'red' : 'green'}">${esc(r.status)}</span>` },
        { key: 'location', label: 'Location' }, { key: 'supplier', label: 'Supplier' }, { key: 'phone_number', label: 'Phone' },
      ],
      rowClass: r => r.low ? 'row-low' : '',
      onSelect(r) {
        editing = r.code;
        fillForm(form, r);
        F.code.value = r.code;
        F.code.readOnly = true;
        $('#m-mode').textContent = `Editing ${r.code}`;
      },
    });
    const sb = searchBar($('#m-search'), table, {
      options: [['*', 'All fields'], ['code', 'Material Code'], ['material_name', 'Material Name']],
      extra: '<label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="m-lowonly"> Low Stock Items only</label>',
    });
    const baseFilter = table.setFilter.bind(table);
    table.setFilter = fn => baseFilter(r => ($('#m-lowonly').checked ? r.low : true) && (!fn || fn(r)));
    $('#m-lowonly').onchange = () => sb.apply();

    const load = async () => {
      const [m, c, s] = await Promise.all([api('GET', '/api/materials'), api('GET', '/api/categories'), api('GET', '/api/suppliers')]);
      meta = m;
      table.setRows(m.rows);
      sb.apply();
      setOptions(F.category, c.rows.map(x => x.name));
      setOptions(F.unit_measure, m.units);
      setOptions(F.location, m.locations);
      $('#m-sup-list').innerHTML = [...new Set(s.rows.map(r => r.supplier).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('');
    };
    const clear = () => { resetForm(form); F.code.readOnly = false; editing = null; table.clearSelection(); $('#m-mode').textContent = ''; };

    const offerAlert = async (code) => {
      const m = table.rows.find(r => r.code === code);
      if (!m || !m.low) return;
      if (!m.phone_number) { toast(`${m.material_name} is low on stock (no phone number saved for alerts)`, 'warn'); return; }
      if (await confirmBox(`Stock is low for ${m.material_name}!\nCurrent: ${m.current_stock}, Min: ${m.min_stock}\n\nSend WhatsApp alert?`, 'Open WhatsApp', 'whatsapp'))
        window.open(waLink(m.phone_number, lowStockMessage(m)), '_blank');
    };

    $('#m-add').onclick = async () => {
      const d = readForm(form);
      const r = await act(api('POST', '/api/materials', d));
      if (r) { clear(); await load(); if (r.low) offerAlert(d.code); }
    };
    $('#m-update').onclick = async () => {
      if (!editing) return toast('Select a material first', 'error');
      const code = editing;
      const r = await act(api('PUT', `/api/materials/${encodeURIComponent(code)}`, readForm(form)));
      if (r) { clear(); await load(); if (r.low) offerAlert(code); }
    };
    $('#m-delete').onclick = async () => {
      if (!editing) return toast('No row selected', 'error');
      if (!(await confirmBox('Delete this raw material?', 'Delete'))) return;
      try {
        const r = await api('DELETE', `/api/materials/${encodeURIComponent(editing)}`);
        toast(r.message, 'success');
      } catch (e) {
        if (!e.data?.needs_confirm) return toast(e.message, 'error');
        if (!(await confirmBox(`${e.message}\n\nDeleting will affect production planning. Continue?`, 'Delete anyway'))) return;
        if (!(await act(api('DELETE', `/api/materials/${encodeURIComponent(editing)}?force=1`)))) return;
      }
      clear();
      load();
    };
    $('#m-clear').onclick = clear;
    $('#m-wa').onclick = () => {
      const m = table.selected;
      if (!m) return toast('Select a material first', 'error');
      if (!m.phone_number) return toast('No phone number saved for this material', 'error');
      window.open(waLink(m.phone_number, lowStockMessage(m)), '_blank');
    };
    $('#m-export').onclick = () => download(`raw_materials_${today()}.csv`, toCSV(table.view, table.columns));

    $('#m-bulk').onclick = () => {
      const items = table.rows.filter(r => r.low && r.phone_number);
      if (!items.length) return toast('No low stock items with phone numbers found');
      modal({
        title: `Bulk WhatsApp Alert - ${items.length} low stock item(s)`, wide: true,
        html: `<p style="margin-top:0">Click each button to open WhatsApp with the alert message ready to send.</p>
          <div class="table-wrap"><table class="data"><thead><tr><th>Material</th><th>Current</th><th>Min</th><th>Phone</th><th></th></tr></thead><tbody>${
          items.map(m => `<tr><td>${esc(m.material_name)}</td><td class="num">${fmt(m.current_stock)}</td><td class="num">${fmt(m.min_stock)}</td><td>${esc(m.phone_number)}</td>
            <td><a class="btn whatsapp sm" target="_blank" rel="noopener" href="${esc(waLink(m.phone_number, lowStockMessage(m)))}">📲 Send</a></td></tr>`).join('')
        }</tbody></table></div>`,
      });
    };

    $('#m-adjust').onclick = () => {
      const opts = table.rows.map(r => [r.code, `${r.display_code} - ${r.material_name} (${fmt(r.current_stock)} ${r.unit_measure})`]);
      modal({
        title: 'Stock Adjustment',
        html: `<form id="adj-form"><div class="form-grid" style="grid-template-columns:1fr">
          ${field('code', 'Select Material', { type: 'select', options: opts, required: true })}
          ${field('type', 'Adjustment Type', { type: 'select', options: [['Add', 'Add Stock'], ['Remove', 'Remove Stock']], placeholder: 'Choose…' })}
          ${field('quantity', 'Quantity', { type: 'number', step: '0.01', min: 0, required: true })}
          ${field('reason', 'Reason', { type: 'textarea', rows: 3 })}
        </div></form>`,
        onOpen: back => {
          const f = $('#adj-form', back);
          f.elements.type.value = 'Add';
          if (table.selected) f.elements.code.value = table.selected.code;
        },
        buttons: [{ label: 'Cancel' }, {
          label: 'Apply Adjustment', cls: 'primary', handler: async back => {
            const d = readForm($('#adj-form', back));
            if (!d.code || !d.quantity) { toast('Please select material and enter quantity', 'error'); return false; }
            const r = await act(api('POST', `/api/materials/${encodeURIComponent(d.code)}/adjust`, d));
            if (!r) return false;
            await load();
            if (r.low) offerAlert(d.code);
          },
        }],
      });
    };

    $('#m-impact').onclick = () => {
      const ratios = meta.fabric_ratios || {};
      const rows = [];
      table.rows.forEach(m => {
        const key = Object.keys(ratios).find(k => norm(k) === norm(m.material_name));
        if (!key) return;
        Object.entries(ratios[key]).forEach(([prod, per]) => rows.push({ m, prod, per, max: per > 0 ? Math.floor(m.available / per) : 0 }));
      });
      modal({
        title: 'Production Impact Analysis', wide: true,
        html: `<div class="tabs"><button class="tab active" data-tab="cons">Consumption Analysis</button><button class="tab" data-tab="cap">Production Capacity</button></div>
          <div class="tab-panel active" data-tab="cons">
            <div class="table-wrap"><table class="data"><thead><tr><th>Material</th><th>Product Type</th><th>Consumption/Piece (kg)</th><th>Max Pieces from Stock</th></tr></thead><tbody>${
              rows.length ? rows.map(r => `<tr><td>${esc(r.m.material_name)}</td><td>${esc(r.prod.replace(/_/g, ' '))}</td><td class="num">${r.per.toFixed(3)}</td><td class="num">${fmtInt(r.max)}</td></tr>`).join('')
                : '<tr><td colspan="4" class="empty">No fabric materials match the consumption table</td></tr>'
            }</tbody></table></div></div>
          <div class="tab-panel" data-tab="cap">
            <div class="form-grid" id="cap-form">
              ${field('ptype', 'Select Product Type', { type: 'select', options: (meta.product_types || []).map(p => [p, p.replace(/_/g, ' ')]) })}
              ${field('pqty', 'Desired Quantity', { type: 'number', min: 1 })}
              <div class="field"><label>&nbsp;</label><button class="btn success" id="cap-go" type="button">Calculate Capacity</button></div>
            </div>
            <pre class="report" id="cap-out" style="margin-top:14px">Select a product type and quantity.</pre>
          </div>`,
        onOpen: back => {
          tabs(back);
          $('#cap-go', back).onclick = () => {
            const type = $('[name=ptype]', back).value, qty = parseInt($('[name=pqty]', back).value, 10);
            if (!type || !(qty > 0)) return toast('Please select product type and enter quantity', 'error');
            let t = `PRODUCTION CAPACITY ANALYSIS\nProduct: ${type.replace(/_/g, ' ')}\nDesired Quantity: ${qty} pieces\n${'='.repeat(50)}\n\n`;
            let can = true, any = false;
            const bottlenecks = [];
            table.rows.forEach(m => {
              const key = Object.keys(ratios).find(k => norm(k) === norm(m.material_name));
              const per = key && ratios[key][type];
              if (!per) return;
              any = true;
              const need = per * qty;
              t += `Material: ${m.material_name}\n  Required: ${need.toFixed(2)} kg\n  Available: ${m.available.toFixed(2)} kg\n`;
              if (m.available >= need) t += '  Status: ✓ SUFFICIENT\n\n';
              else {
                can = false;
                t += `  Status: ✗ INSUFFICIENT (Shortage: ${(need - m.available).toFixed(2)} kg)\n\n`;
                bottlenecks.push(`${m.material_name}: Need ${(need - m.available).toFixed(2)} kg more`);
              }
            });
            if (!any) t += 'No fabric in stock is used for this product type.\n\n';
            t += `OVERALL RESULT: ${can && any ? '✓ CAN PRODUCE' : '✗ CANNOT PRODUCE'}\n`;
            if (bottlenecks.length) t += `\nBOTTLENECKS:\n${bottlenecks.map(b => `• ${b}`).join('\n')}\n`;
            $('#cap-out', back).textContent = t;
          };
        },
      });
    };

    await load();
  },
});

</script>

            <button class="btn danger" id="att-stop">■ Stop Server</button>

            <button class="btn primary" id="att-daily">📄 Daily Report</button>
            <button class="btn ghost" id="att-export">⬇️ Export CSV</button>

      </div>

      <div class="tab-panel" data-tab="emp">
        <div class="card"><h3>Employee Registration Management</h3>
          <p class="help" style="font-size:12px;color:var(--muted);margin-top:0">Cards registered on the ESP32 reader appear here as "Unknown" - select the row and give it a name.</p>
          <div class="toolbar">
            <input id="emp-newname" placeholder="New name for selected employee" style="min-width:260px">
            <button class="btn primary" id="emp-rename">Update Name</button>
          </div>
          <div id="emp-table"></div>

      <div class="tab-panel" data-tab="dash">
        <div class="card">
          <div class="toolbar">
            <label><b>Time Period:</b></label>
            <select id="pd-period">${['Today', 'This Week', 'This Month', 'This Year', 'All Time'].map(p => `<option ${p === 'This Month' ? 'selected' : ''}>${p}</option>`).join('')}</select>
            <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pd-auto" checked> Auto-refresh every 10 seconds</label>
