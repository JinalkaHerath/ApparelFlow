<!DOCTYPE html>
<!--
  ApparelFlow - Inventory Management System (single-file version)
  ---------------------------------------------------------------
  Just double-click this file to open it in Chrome / Edge. Internet is needed to reach Firebase.
  Demo with sample data (no Firebase): click "Try demo" on the login page.

  Settings are in CONFIG near the top of the "data layer" script (search for DB_URL).

  SECURITY: this page reads/writes your Realtime Database directly, exactly like
  productivity.py already did with requests.get(...). That only works while the
  database rules allow public access - which also means anyone who knows the URL
  can read employee_data (including passwords). Hardware listeners (ESP32 attendance,
  RFID UDP, productivity port 8081) need the Python server version (app.py).
-->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ApparelFlow - Inventory Management System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👔</text></svg>">
  <script>
  /* apply saved theme before first paint (no white flash in dark mode) */
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('af_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root {
  --primary: #2C3E50;
  --primary-2: #34495E;
  --blue: #3498DB;
  --blue-dark: #2980B9;
  --green: #27AE60;
  --red: #E74C3C;
  --orange: #F39C12;
  --purple: #9B59B6;
  --teal: #16A085;
  --bg: #F4F6F8;
  --card: #FFFFFF;
  --line: #E3E8EE;
  --text: #2C3E50;
  --muted: #7F8C8D;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(44, 62, 80, .08), 0 4px 14px rgba(44, 62, 80, .05);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
.hidden { display: none !important; }

/* ---------------- Login ---------------- */
#login-view { display: flex; min-height: 100vh; }
.login-brand {
  flex: 0 0 42%; background: #E8F4FD; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 40px;
}
.login-brand .logo { font-size: 72px; margin-bottom: 12px; }
.login-brand h1 { color: var(--blue); font-size: 34px; margin: 0 0 8px; }
.login-brand .sub { color: #5D6D7E; font-weight: 600; margin-bottom: 4px; }
.login-brand .tag { color: var(--muted); font-size: 13px; }
.login-form-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; }
.login-form { width: min(380px, 90%); }
.login-form h2 { margin: 0 0 6px; text-align: center; font-size: 26px; }
.login-form p.hint { text-align: center; color: var(--muted); margin: 0 0 28px; }
.login-form label { display: block; font-weight: 600; font-size: 12px; margin: 14px 0 6px; }
.login-form input { width: 100%; padding: 11px 12px; border: 1px solid #CCD4DD; border-radius: 8px; }
.login-form input:focus { outline: 2px solid #AED6F1; border-color: var(--blue); }
.login-form .btn { width: 100%; margin-top: 22px; padding: 12px; font-size: 15px; }
.login-error { color: var(--red); min-height: 20px; margin-top: 12px; text-align: center; }
.login-foot { position: absolute; bottom: 18px; color: var(--muted); font-size: 12px; }
.demo-banner { background: #FEF5E7; color: #9A6B10; border: 1px solid #F8C471; padding: 8px 12px; border-radius: 8px; margin-top: 18px; font-size: 12px; }

/* ---------------- Shell ---------------- */
#app-view { display: grid; grid-template-columns: 230px 1fr; grid-template-rows: 60px 1fr; height: 100vh; }
.topbar {
  grid-column: 1 / -1; background: var(--primary); color: #fff; display: flex; align-items: center;
  padding: 0 18px; gap: 16px;
}
.topbar .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.topbar .brand small { font-weight: 400; opacity: .7; font-size: 12px; }
.topbar .spacer { flex: 1; }
.topbar .clock { font-variant-numeric: tabular-nums; opacity: .85; font-size: 13px; }
.topbar .user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.topbar .user .role { background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 20px; font-size: 11px; }
.menu-toggle { display: none; background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }

.sidebar { background: var(--primary-2); padding: 14px 10px; overflow-y: auto; }
.sidebar .menu-label { color: #95A5A6; font-size: 11px; letter-spacing: .08em; margin: 4px 10px 10px; font-weight: 700; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin-bottom: 4px;
  background: transparent; color: #ECF0F1; border: 0; border-radius: 8px; cursor: pointer; text-align: left;
  font-weight: 600;
}
.nav-item:hover { background: rgba(255,255,255,.08); }
.nav-item.active { background: var(--blue); color: #fff; }
.nav-item.locked { opacity: .45; }
.nav-item .ico { width: 22px; text-align: center; font-size: 16px; }
.nav-item.logout { margin-top: 16px; background: rgba(231, 76, 60, .15); color: #F5B7B1; }
.nav-item.logout:hover { background: var(--red); color: #fff; }

main#content { overflow: auto; padding: 22px 26px 40px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 22px; }
.page-head .sub { color: var(--muted); font-size: 13px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------- Cards ---------------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
.card h3 { margin: 0 0 14px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card h3 .right { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }
.grid { display: grid; gap: 18px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; position: relative; overflow: hidden;
  border-left: 4px solid var(--accent, var(--blue)); cursor: default;
}
.stat.clickable { cursor: pointer; }
.stat.clickable:hover { transform: translateY(-1px); }
.stat .label { padding-right: 30px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.stat .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
.stat .ico { position: absolute; right: 14px; top: 12px; font-size: 26px; opacity: .25; }
.chart-box { position: relative; height: 290px; }
.chart-box.tall { height: 360px; }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }

/* ---------------- Forms ---------------- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.form-grid .wide { grid-column: span 2; }
.form-grid .full { grid-column: 1 / -1; }
.field label { display: block; font-size: 12px; font-weight: 600; color: #566573; margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #CCD4DD; border-radius: 7px; background: #FDFEFE;
}
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid #AED6F1; border-color: var(--blue); }
.field input[readonly] { background: #F2F4F4; }
.field .inline { display: flex; gap: 6px; }
.field .inline input { flex: 1; }
.field .help { font-size: 11px; color: var(--muted); margin-top: 3px; }
.check { display: flex; align-items: center; gap: 8px; padding-top: 22px; font-weight: 600; }
.form-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.editing-note { font-size: 12px; color: var(--blue-dark); margin-left: auto; align-self: center; }

.btn {
  border: 0; border-radius: 7px; padding: 8px 16px; cursor: pointer; font-weight: 600; background: #D5DBDB; color: var(--text);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--blue-dark); }
.btn.success { background: var(--green); color: #fff; }
.btn.danger { background: var(--red); color: #fff; }
.btn.warning { background: var(--orange); color: #fff; }
.btn.purple { background: var(--purple); color: #fff; }
.btn.teal { background: var(--teal); color: #fff; }
.btn.whatsapp { background: #25D366; color: #fff; }
.btn.ghost { background: transparent; border: 1px solid #CCD4DD; }
.btn.sm { padding: 5px 10px; font-size: 12px; }

/* ---------------- Toolbar & tables ---------------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar select, .toolbar input { padding: 7px 10px; border: 1px solid #CCD4DD; border-radius: 7px; background: #fff; }
.toolbar input[type=search] { min-width: 220px; }
.toolbar .count { margin-left: auto; color: var(--muted); font-size: 12px; }
.table-wrap { overflow: auto; max-height: 460px; border: 1px solid var(--line); border-radius: 8px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  position: sticky; top: 0; background: #4B78AC; color: #fff; text-align: left; padding: 9px 10px; font-weight: 600;
  cursor: pointer; white-space: nowrap; user-select: none; z-index: 1;
}
table.data th .arrow { opacity: .7; font-size: 10px; }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:nth-child(even) { background: #FAFBFC; }
table.data tbody tr:hover { background: #EBF5FB; }
table.data tbody tr.selected { background: #D6EAF8 !important; }
table.data tbody tr.row-low td { background: #FDEDEC; color: #B03A2E; }
table.data tbody tr.row-ok td { color: #1E8449; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge.red { background: #FADBD8; color: #B03A2E; }
.badge.green { background: #D5F5E3; color: #1E8449; }
.badge.gray { background: #EAEDED; color: #566573; }
.badge.blue { background: #D6EAF8; color: #1F618D; }

/* ---------------- Tabs ---------------- */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
.tab { background: none; border: 0; padding: 10px 16px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ---------------- Modal / toast ---------------- */
.modal-back { position: fixed; inset: 0; background: rgba(23, 32, 42, .45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 12px; width: min(560px, 100%); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(900px, 100%); }
.modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 16px; display: flex; align-items: center; }
.modal header .x { margin-left: auto; background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--muted); }
.modal .body { padding: 18px 20px; overflow: auto; }
.modal footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
pre.report { background: #F8F9FA; border: 1px solid var(--line); border-radius: 8px; padding: 14px; font-family: Consolas, "Courier New", monospace; font-size: 12.5px; white-space: pre-wrap; margin: 0; }

#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast { background: var(--primary); color: #fff; padding: 11px 16px; border-radius: 8px; box-shadow: var(--shadow); max-width: 380px; animation: slide .2s ease-out; white-space: pre-line; }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }
.toast.warn { background: var(--orange); }
@keyframes slide { from { transform: translateY(10px); opacity: 0; } }

.loading { position: relative; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.15); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.page-loading { padding: 60px; text-align: center; color: var(--muted); }

.status-bar { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(39,174,96,.2); }
.dot.off { background: var(--red); }
.log { font-family: Consolas, monospace; font-size: 11.5px; background: #17202A; color: #D5DBDB; padding: 10px; border-radius: 8px; max-height: 160px; overflow: auto; white-space: pre; }
.barcode-preview { text-align: center; padding: 16px; background: #fff; border: 1px dashed #CCD4DD; border-radius: 8px; min-height: 120px; }
.barcode-preview canvas { max-width: 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv b { color: #566573; }

@media (max-width: 900px) {
  #app-view { grid-template-columns: minmax(0, 1fr); }
  .topbar { padding: 0 10px; gap: 10px; }
  .topbar .brand small, .topbar .user .role { display: none; }
  .topbar .user { font-size: 12px; text-align: right; }
  .page-head h1 { font-size: 19px; }
  .form-grid { grid-template-columns: minmax(0, 1fr) !important; }
  .sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 240px; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; }
  .menu-toggle { display: block; }
  .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
  .form-grid .wide { grid-column: auto; }
  #login-view { flex-direction: column; }
  .login-brand { flex: none; padding: 30px; }
  main#content { padding: 16px; }
  .topbar .clock { display: none; }
}
@media print {
  .sidebar, .topbar, .no-print { display: none !important; }
}

/* =====================================================================
   LIQUID GLASS THEME - plain / neutral, light + dark
   Frosted glass over a soft monochrome backdrop. Toggle: <html data-theme="dark">
   ===================================================================== */
:root {
  --bg-1: #f5f5f7;
  --bg-2: #e9e9ee;
  --bg-shade: rgba(0, 0, 0, .05);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(255, 255, 255, .78);
  --glass-soft: rgba(255, 255, 255, .40);
  --glass-hover: rgba(255, 255, 255, .72);
  --edge: rgba(255, 255, 255, .85);
  --edge-dim: rgba(0, 0, 0, .06);
  --sheen: rgba(255, 255, 255, .55);
  --shadow: 0 1px 1px rgba(0, 0, 0, .03), 0 8px 28px rgba(0, 0, 0, .07), inset 0 1px 0 rgba(255, 255, 255, .9);
  --shadow-hover: 0 2px 2px rgba(0, 0, 0, .04), 0 14px 38px rgba(0, 0, 0, .10), inset 0 1px 0 #fff;
  --blur: blur(24px) saturate(160%);
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(0, 0, 0, .07);
  --input: rgba(255, 255, 255, .7);
  --input-focus: #fff;
  --focus-ring: rgba(0, 0, 0, .12);
  --accent-bg: #1d1d1f;
  --accent-fg: #ffffff;
  --danger: #c4372b;
  --danger-bg: rgba(196, 55, 43, .09);
  --ok: #2f7d4a;
  --ok-bg: rgba(47, 125, 74, .10);
  --warn: #9a6a00;
  --warn-bg: rgba(154, 106, 0, .10);
  --sel: rgba(0, 0, 0, .06);
  --radius: 20px;
  --blue: #1d1d1f;
  --blue-dark: #1d1d1f;
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg-1: #0c0c0e;
  --bg-2: #18181b;
  --bg-shade: rgba(255, 255, 255, .04);
  --glass: rgba(40, 40, 44, .55);
  --glass-strong: rgba(48, 48, 52, .75);
  --glass-soft: rgba(36, 36, 40, .42);
  --glass-hover: rgba(70, 70, 76, .55);
  --edge: rgba(255, 255, 255, .12);
  --edge-dim: rgba(255, 255, 255, .06);
  --sheen: rgba(255, 255, 255, .06);
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .08);
  --shadow-hover: 0 2px 2px rgba(0, 0, 0, .35), 0 16px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .12);
  --text: #f5f5f7;
  --muted: #a1a1a6;
  --line: rgba(255, 255, 255, .08);
  --input: rgba(255, 255, 255, .06);
  --input-focus: rgba(255, 255, 255, .10);
  --focus-ring: rgba(255, 255, 255, .18);
  --accent-bg: #f5f5f7;
  --accent-fg: #111113;
  --danger: #ff7b6e;
  --danger-bg: rgba(255, 123, 110, .12);
  --ok: #7ccf95;
  --ok-bg: rgba(124, 207, 149, .12);
  --warn: #e8b84a;
  --warn-bg: rgba(232, 184, 74, .12);
  --sel: rgba(255, 255, 255, .09);
  --blue: #f5f5f7;
  --blue-dark: #f5f5f7;
  color-scheme: dark;
}

html { background: var(--bg-1); transition: background .3s; }
body { background: transparent; color: var(--text); min-height: 100vh; position: relative; overflow-x: hidden; }
a { color: var(--text); }

/* soft neutral backdrop with gentle light pools (no colour) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(60vmax 45vmax at 15% 0%, var(--bg-shade), transparent 60%),
    radial-gradient(50vmax 40vmax at 100% 100%, var(--bg-shade), transparent 60%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(70vmax 40vmax at 50% -10%, var(--sheen), transparent 70%);
}

/* glass surfaces */
.card, .stat, .modal, .sidebar, .topbar, .login-form-wrap .login-form, .toast, .table-wrap, .tabs, .btn, .theme-toggle {
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}

/* ---------- shell ---------- */
#app-view { gap: 14px; padding: 14px; grid-template-rows: 64px 1fr; background: transparent; }
.topbar { background: var(--glass); color: var(--text); border: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow); }
.topbar .brand, .menu-toggle { color: var(--text); }
.topbar .brand small, .topbar .clock { color: var(--muted); opacity: 1; }
.topbar .user .role { background: var(--sel); color: var(--text); border: 1px solid var(--edge-dim); }

.sidebar { background: var(--glass-soft); border: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 12px; }
.sidebar .menu-label { color: var(--muted); }
.nav-item { color: var(--text); border-radius: 12px; font-weight: 500; transition: background .2s; }
.nav-item:hover { background: var(--glass-hover); }
.nav-item.active { background: var(--glass-strong); color: var(--text); font-weight: 650; box-shadow: var(--shadow); border: 1px solid var(--edge); }
.nav-item .ico { font-size: 17px; filter: none; opacity: 1; }
.nav-item.logout { background: transparent; color: var(--danger); border: 1px solid var(--edge-dim); }
.nav-item.logout:hover { background: var(--danger-bg); color: var(--danger); }

main#content { padding: 6px 8px 40px; }
.page-head h1 { font-weight: 650; letter-spacing: -.015em; }
.page-head .sub, .status-bar { color: var(--muted); }

/* ---------- panels ---------- */
.card { position: relative; background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shadow); border-radius: var(--radius); padding: 20px; }
.card, .stat, .modal { isolation: isolate; }
.card::before, .stat::before, .modal::before {          /* glass sheen sits behind the content */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(180deg, var(--sheen) 0%, transparent 35%);
}
.card h3 { font-weight: 650; }
.card h3 .right { color: var(--muted); }

.stat { background: var(--glass); border: 1px solid var(--edge); border-left: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
.stat::after { display: none; }
.stat.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat .label { color: var(--muted); font-weight: 600; }
.stat .value { color: var(--text); font-weight: 650; }
.stat .ico {
  opacity: 1; filter: none; font-size: 21px; width: 42px; height: 42px; top: 14px; right: 14px;
  display: flex; align-items: center; justify-content: center; border-radius: 13px;
  background: var(--glass-strong); border: 1px solid var(--edge); box-shadow: var(--shadow);
}

/* ---------- forms ---------- */
.field label { color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, .toolbar select, .toolbar input, .cell-input,
#p-scan, #emp-newname, #rf-emp, #rf-date, .login-form input {
  background: var(--input) !important; color: var(--text); border: 1px solid var(--edge-dim) !important;
  border-radius: 11px !important; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .04); transition: background .2s, box-shadow .2s;
}
.field input:focus, .field select:focus, .field textarea:focus, .toolbar input:focus, .toolbar select:focus, .cell-input:focus, .login-form input:focus {
  outline: none; background: var(--input-focus) !important; box-shadow: 0 0 0 4px var(--focus-ring);
}
.field input[readonly] { opacity: .7; }
.cell-input { width: 100%; padding: 7px 9px; }
select option { background: var(--bg-1); color: var(--text); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }

/* ---------- buttons: monochrome glass ---------- */
.btn {
  border-radius: 999px; padding: 9px 18px; border: 1px solid var(--edge); background: var(--glass-strong); color: var(--text);
  font-weight: 600; box-shadow: var(--shadow); text-shadow: none; transition: transform .15s, box-shadow .2s, background .2s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-hover); background: var(--glass-strong); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary, .btn.success { background: var(--accent-bg); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover:not(:disabled), .btn.success:hover:not(:disabled) { background: var(--accent-bg); opacity: .9; }
.btn.danger { background: var(--glass-strong); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger-bg); }
.btn.warning, .btn.purple, .btn.teal, .btn.whatsapp, .btn.ghost { background: var(--glass-strong); color: var(--text); }
.btn.ghost { background: var(--glass-soft); }

/* ---------- tables ---------- */
.table-wrap { background: var(--glass-soft); border: 1px solid var(--edge); border-radius: 14px; box-shadow: inset 0 1px 0 var(--sheen); }
table.data th { background: var(--glass-strong); color: var(--muted); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--line); font-weight: 600; font-size: 12px; letter-spacing: .02em; }
table.data td { border-bottom: 1px solid var(--line); color: var(--text); }
table.data tbody tr:nth-child(even) { background: transparent; }
table.data tbody tr:hover { background: var(--glass-hover); }
table.data tbody tr.selected { background: var(--sel) !important; box-shadow: inset 3px 0 0 var(--text); }
table.data tbody tr.row-low td { background: var(--danger-bg); color: var(--danger); }
.badge { border: 1px solid var(--edge-dim); font-weight: 600; }
.badge.red { background: var(--danger-bg); color: var(--danger); }
.badge.green { background: var(--ok-bg); color: var(--ok); }
.badge.gray, .badge.blue { background: var(--sel); color: var(--text); }

/* ---------- tabs: segmented control ---------- */
.tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--edge); background: var(--glass-soft); border-radius: 999px; box-shadow: var(--shadow); max-width: 100%; }
.tab { border: 0; border-radius: 999px; margin: 0; padding: 8px 16px; color: var(--muted); font-weight: 500; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); font-weight: 650; border-bottom-color: transparent; background: var(--glass-strong); box-shadow: var(--shadow); }

/* ---------- modal, toast, misc ---------- */
.modal-back { background: rgba(0, 0, 0, .22); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.modal { position: relative; background: var(--glass-strong); border: 1px solid var(--edge); border-radius: 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, .25), inset 0 1px 0 var(--sheen); color: var(--text); }
.modal header, .modal footer { border-color: var(--line); }
.modal header .x { color: var(--muted); }
.toast, .toast.success, .toast.error, .toast.warn { background: var(--glass-strong); color: var(--text); border: 1px solid var(--edge); border-radius: 14px; box-shadow: var(--shadow-hover); }
.toast { border-left: 4px solid var(--muted); }
.toast.success { border-left-color: var(--ok); }
.toast.error { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
pre.report { background: var(--glass-soft); border: 1px solid var(--edge); border-radius: 14px; color: var(--text); }
.log { background: rgba(0, 0, 0, .78); border-radius: 14px; border: 1px solid var(--edge-dim); }
.barcode-preview { background: #fff; border: 1px dashed var(--line); border-radius: 16px; }
.demo-banner { background: var(--warn-bg) !important; border: 1px solid var(--edge-dim) !important; color: var(--text) !important; border-radius: 12px; }
.empty, .help { color: var(--muted) !important; }
.dot.on { background: var(--ok); box-shadow: none; }
.dot.off { background: var(--danger); }
.kv b { color: var(--muted); }
.editing-note { color: var(--muted); }
.spinner { border-color: var(--line); border-top-color: var(--text); }

/* ---------- theme toggle ---------- */
.theme-toggle {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 12px; border-radius: 999px;
  border: 1px solid var(--edge); background: var(--glass-strong); color: var(--text); box-shadow: var(--shadow);
  cursor: pointer; font-size: 13px; transition: transform .15s, box-shadow .2s;
}
.theme-toggle span { font-size: 15px; line-height: 1; }
.theme-toggle b { font-weight: 600; }
.theme-toggle:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.theme-toggle.floating { position: fixed; top: 18px; right: 18px; z-index: 5; }
@media (max-width: 900px) { .topbar .theme-toggle b { display: none; } .topbar .theme-toggle { padding: 0 11px; } }

/* ---------- login ---------- */
#login-view, .login-brand, .login-form-wrap { background: transparent; }
.login-brand h1 { color: var(--text); background: none; -webkit-background-clip: initial; background-clip: initial; font-size: 42px; font-weight: 700; letter-spacing: -.025em; }
.login-brand .logo { filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .18)); }
.login-brand .sub { color: var(--text); }
.login-brand .tag, .login-foot, .login-form p.hint { color: var(--muted); }
.login-form label { color: var(--muted); }
.login-form-wrap .login-form { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: 28px; padding: 36px 32px; box-shadow: var(--shadow-hover); }
.login-form .btn { border-radius: 14px; }
.login-error { color: var(--danger); }

/* plain glass, but icons keep their full colour */
.topbar .brand, .page-head h1, .card h3, .tab, .btn, .nav-item { filter: none; }
.stat .label { padding-right: 52px; }

/* Job File editable schedule */
#j-ops td { max-width: none; overflow: visible; }

@media (max-width: 900px) {
  #app-view { padding: 8px; gap: 8px; grid-template-rows: 60px 1fr; }
  .sidebar { top: 76px; left: 8px; bottom: 8px; border-radius: var(--radius); transform: translateX(calc(-100% - 24px)); background: var(--glass-strong); }
  .sidebar.open { transform: none; }
  .tabs { display: flex; border-radius: 18px; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .card, .stat, .topbar, .sidebar, .modal, .login-form-wrap .login-form { background: var(--bg-1); }
}
@media (max-width: 600px) {
  .topbar .brand { white-space: nowrap; font-size: 16px; }
  .topbar .user { max-width: 110px; line-height: 1.2; }
}

/* =====================================================================
   SEA-BLUE FROSTED GLASS NAVIGATION MENU
   ===================================================================== */
:root {
  --sea-1: rgba(0, 98, 142, .86);      /* sea blue  #00628E */
  --sea-2: rgba(0, 128, 164, .80);     /* lighter sea #0080A4 */
  --sea-edge: rgba(255, 255, 255, .45);
  --sea-glow: rgba(0, 120, 165, .22);
  --sea-text: #ffffff;
  --sea-dim: rgba(255, 255, 255, .78);
  --sea-active-text: #005b82;
}
html[data-theme="dark"] {
  --sea-1: rgba(0, 72, 105, .78);
  --sea-2: rgba(0, 104, 132, .62);
  --sea-edge: rgba(140, 220, 255, .22);
  --sea-glow: rgba(0, 140, 190, .20);
  --sea-active-text: #00384f;
}

/* faint sea-blue light behind the menu so the frosting has something to blur */
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(420px 520px at 120px 260px, var(--sea-glow), transparent 70%),
    radial-gradient(360px 420px at 80px 85%, var(--sea-glow), transparent 70%),
    radial-gradient(70vmax 40vmax at 50% -10%, var(--sheen), transparent 70%);
}

@media (min-width: 901px) { .sidebar { position: relative; } }   /* phones keep the slide-in (fixed) menu */
.sidebar {
  background: linear-gradient(165deg, var(--sea-1) 0%, var(--sea-2) 100%) !important;
  -webkit-backdrop-filter: blur(26px) saturate(170%);
  backdrop-filter: blur(26px) saturate(170%);
  border: 1px solid var(--sea-edge) !important;
  box-shadow: 0 12px 40px rgba(0, 78, 112, .28), inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(255, 255, 255, .08) !important;
  isolation: isolate;
}
.sidebar::before {                      /* glass sheen across the top */
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 32%);
}
.sidebar .menu-label { color: var(--sea-dim) !important; letter-spacing: .1em; }

.sidebar .nav-item {
  color: var(--sea-text) !important; background: transparent; border: 1px solid transparent;
  text-shadow: 0 1px 2px rgba(0, 40, 60, .25);
}
.sidebar .nav-item:hover {
  background: rgba(255, 255, 255, .16) !important; border-color: rgba(255, 255, 255, .22);
}
.sidebar .nav-item.active {
  background: rgba(255, 255, 255, .9) !important; color: var(--sea-active-text) !important;
  border: 1px solid rgba(255, 255, 255, .95) !important; text-shadow: none; font-weight: 650;
  box-shadow: 0 6px 18px rgba(0, 50, 75, .25), inset 0 1px 0 #fff !important;
}
.sidebar .nav-item.locked { opacity: .55; }
.sidebar .nav-item .ico {              /* colourful icons sit on small frosted tiles */
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 9px; background: rgba(255, 255, 255, .18); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3);
  text-shadow: none;
}
.sidebar .nav-item.active .ico { background: rgba(0, 105, 148, .1); }
.sidebar .nav-item.logout {
  color: #ffffff !important; background: rgba(255, 255, 255, .08) !important; border: 1px solid rgba(255, 255, 255, .25) !important;
}
.sidebar .nav-item.logout:hover { background: rgba(231, 76, 60, .85) !important; color: #fff !important; }

@media (max-width: 900px) {
  .sidebar { background: linear-gradient(165deg, rgba(0, 105, 148, .93), rgba(0, 140, 172, .9)) !important; }
  html[data-theme="dark"] .sidebar { background: linear-gradient(165deg, rgba(0, 66, 96, .95), rgba(0, 96, 124, .92)) !important; }
}

</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="login-view" class="hidden">
  <button class="theme-toggle floating" id="theme-toggle-login" type="button" title="Switch White / Dark theme"></button>
  <div class="login-brand">
    <div class="logo">👔</div>
    <h1>ApparelFlow</h1>
    <div class="sub">Inventory Management System</div>
    <div class="tag">Streamlining Fashion Retail Operations</div>
  </div>
  <div class="login-form-wrap">
    <form class="login-form" id="login-form" autocomplete="on">
      <h2>Welcome Back</h2>
      <p class="hint">Sign in to continue to your dashboard</p>
      <label for="login-id">Employee ID</label>
      <input id="login-id" name="emp_id" autocomplete="username" required>
      <label for="login-pw">Password</label>
      <input id="login-pw" name="password" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="login-btn">Login to Dashboard</button>
      <div class="login-error" id="login-error"></div>
      <p style="text-align:center"><a href="#" id="forgot-link">Forgot Password?</a></p>
      <div class="demo-banner hidden" id="mode-note"></div>
    </form>
    <div class="login-foot">© ELECXIO SOLUTIONS • Industry Solutions</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
    <div class="brand">👔 ApparelFlow <small>Inventory Management System</small></div>
    <div class="spacer"></div>
    <div class="clock" id="clock"></div>
    <button class="theme-toggle" id="theme-toggle" type="button" title="Switch White / Dark theme"></button>
    <div class="user"><span id="user-name"></span><span class="role" id="user-role"></span></div>
  </header>
  <nav class="sidebar" id="sidebar">
    <div class="menu-label">📋 NAVIGATION MENU</div>
    <div id="nav"></div>
    <button class="nav-item logout" id="logout-btn"><span class="ico">⏻</span>Logout</button>
  </nav>
  <main id="content"></main>
</div>

<script>/* ===== core ===== */
/* ApparelFlow web - shared helpers (no framework, no build step) */
'use strict';

const App = {
  user: null,
  perms: {},
  mode: '',
  pages: {},           // registered pages: id -> {title, icon, module, render}
  cleanup: [],         // functions to run when leaving a page (timers, charts)
};

/* ---------------- basics ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function num(v, d = 0) { const n = parseFloat(v); return Number.isFinite(n) ? n : d; }
function fmt(v, dp = 2) { return num(v).toLocaleString('en-LK', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function fmtInt(v) { return Math.round(num(v)).toLocaleString('en-LK'); }
function today() { const d = new Date(); return isoDate(d); }
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function lkDate(d = new Date()) { return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; }
function norm(s) { return String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function canUse(module) { return !module || (App.perms[module] || []).includes(App.user?.role); }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

/* ---------------- API ---------------- */
/* api() is defined in the standalone data layer below */

/* Run an API call, show toast on success/failure, return result or null */
async function act(promise, successMsg) {
  try {
    const r = await promise;
    const msg = successMsg ?? r.message;
    if (msg) toast(msg, 'success');
    (r.warnings || []).forEach(w => toast(w, 'warn'));
    return r;
  } catch (e) {
    toast(e.message, 'error');
    return null;
  }
}

/* ---------------- toast / modal ---------------- */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), type === 'error' ? 6000 : 3500);
}

function modal({ title, html = '', wide = false, buttons = [{ label: 'Close', cls: '', value: null }], onOpen }) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal ${wide ? 'wide' : ''}" role="dialog">
        <header>${esc(title)}<button class="x" aria-label="Close">×</button></header>
        <div class="body">${html}</div>
        <footer></footer>
      </div>`;
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    $('.x', back).onclick = () => close(null);
    back.addEventListener('mousedown', e => { if (e.target === back) close(null); });
    const footer = $('footer', back);
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = `btn ${b.cls || ''}`;
      btn.textContent = b.label;
      btn.onclick = async () => {
        if (b.handler) {
          const r = await b.handler(back);
          if (r === false) return;
          close(r === undefined ? b.value : r);
        } else close(b.value);
      };
      footer.appendChild(btn);
    });
    document.body.appendChild(back);
    if (onOpen) onOpen(back);
    const first = $('input, select, textarea', $('.body', back));
    if (first) first.focus();
  });
}

function confirmBox(message, okLabel = 'Yes', cls = 'danger') {
  return modal({
    title: 'Confirm',
    html: `<p style="white-space:pre-line;margin:0">${esc(message)}</p>`,
    buttons: [{ label: 'Cancel', value: false }, { label: okLabel, cls, value: true }],
  }).then(v => v === true);
}

function showReport(title, text, filename) {
  return modal({
    title, wide: true,
    html: `<pre class="report">${esc(text)}</pre>`,
    buttons: [
      { label: 'Export .txt', cls: 'ghost', handler: () => { download(filename || `${title.replace(/\W+/g, '_')}.txt`, text, 'text/plain'); return false; } },
      { label: 'Print', cls: 'ghost', handler: () => { printText(title, text); return false; } },
      { label: 'Close', cls: 'primary', value: null },
    ],
  });
}

function printText(title, text) {
  const w = window.open('', '_blank');
  if (!w) return toast('Allow pop-ups to print', 'warn');
  w.document.write(`<title>${esc(title)}</title><pre style="font:13px Consolas,monospace;white-space:pre-wrap">${esc(text)}</pre>`);
  w.document.close();
  w.print();
}

/* ---------------- downloads ---------------- */
function download(filename, content, type = 'text/csv') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: `${type};charset=utf-8` });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function toCSV(rows, columns) {
  const q = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const head = columns.map(c => q(c.label)).join(',');
  const body = rows.map(r => columns.map(c => q(typeof c.value === 'function' ? c.value(r) : r[c.key])).join(','));
  return '﻿' + [head, ...body].join('\r\n');   // BOM so Excel opens UTF-8 correctly
}

/* ---------------- forms ---------------- */
/* field(name, label, {type, options, required, placeholder, cls, help, value, readonly, step}) */
function field(name, label, o = {}) {
  const type = o.type || 'text';
  const id = `f_${name}_${Math.random().toString(36).slice(2, 7)}`;
  const attrs = `id="${id}" name="${name}" ${o.required ? 'required' : ''} ${o.readonly ? 'readonly' : ''}
    ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ''} ${o.step ? `step="${o.step}"` : ''}
    ${o.min !== undefined ? `min="${o.min}"` : ''} ${o.list ? `list="${o.list}"` : ''}`;
  let input;
  if (type === 'select') {
    const opts = (o.options || []).map(v => {
      const [val, txt] = Array.isArray(v) ? v : [v, v];
      return `<option value="${esc(val)}">${esc(txt)}</option>`;
    }).join('');
    input = `<select ${attrs}><option value="">${esc(o.placeholder || 'Select')}</option>${opts}</select>`;
  } else if (type === 'textarea') {
    input = `<textarea ${attrs} rows="${o.rows || 2}"></textarea>`;
  } else if (type === 'checkbox') {
    return `<label class="check ${o.cls || ''}"><input type="checkbox" ${attrs}> ${esc(label)}</label>`;
  } else {
    input = `<input type="${type}" ${attrs} value="${esc(o.value ?? '')}">`;
  }
  if (o.button) input = `<div class="inline">${input}${o.button}</div>`;
  return `<div class="field ${o.cls || ''}"><label for="${id}">${esc(label)}${o.required ? ' *' : ''}</label>${input}${o.help ? `<div class="help">${esc(o.help)}</div>` : ''}</div>`;
}

function setOptions(select, values, keepValue = true) {
  const cur = select.value;
  const ph = select.options[0]?.value === '' ? select.options[0].outerHTML : '';
  select.innerHTML = ph + values.map(v => {
    const [val, txt] = Array.isArray(v) ? v : [v, v];
    return `<option value="${esc(val)}">${esc(txt)}</option>`;
  }).join('');
  if (keepValue) setSelect(select, cur);
}

/* Select a value; if it's not in the list (old data), add it so nothing is lost */
function setSelect(select, value) {
  value = value ?? '';
  if (value !== '' && ![...select.options].some(o => o.value === String(value))) {
    const o = document.createElement('option');
    o.value = o.textContent = value;
    select.appendChild(o);
  }
  select.value = value;
}

function readForm(form) {
  const out = {};
  [...form.elements].forEach(el => {
    if (!el.name) return;
    out[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
  });
  return out;
}

function fillForm(form, data) {
  [...form.elements].forEach(el => {
    if (!el.name || !(el.name in data)) return;
    const v = data[el.name];
    if (el.type === 'checkbox') el.checked = !!v;
    else if (el.tagName === 'SELECT') setSelect(el, v);
    else el.value = v ?? '';
  });
}

function resetForm(form) {
  form.reset();
  [...form.elements].forEach(el => { if (el.dataset.default !== undefined) el.value = el.dataset.default; });
}

/* dd/mm/yyyy <-> yyyy-mm-dd for <input type=date> */
function dmyToIso(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : (/^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '');
}
function isoToDmy(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  return m ? `${m[3]}/${m[2]}/${m[1]}` : s;
}
/* parse "dd/mm/yyyy" or "yyyy-mm-dd" -> Date|null */
function parseAnyDate(s) {
  const iso = dmyToIso(s);
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? null : d;
}

/* ---------------- data table ---------------- */
class DataTable {
  /* columns: [{key, label, num, render(row) -> html, value(row) -> sortable/exportable}] */
  constructor(container, { columns, rowClass, onSelect, onDblClick, rowKey, emptyText = 'No records found' }) {
    this.columns = columns;
    this.rowKey = rowKey;
    this.rowClass = rowClass;
    this.onSelect = onSelect;
    this.onDblClick = onDblClick;
    this.emptyText = emptyText;
    this.rows = [];
    this.view = [];
    this.filterFn = null;
    this.sortKey = null;
    this.sortDir = 1;
    this.selected = null;
    container.innerHTML = `<div class="table-wrap"><table class="data"><thead><tr>${columns.map((c, i) =>
      `<th data-i="${i}">${esc(c.label)} <span class="arrow"></span></th>`).join('')}</tr></thead><tbody></tbody></table></div>`;
    this.tbody = $('tbody', container);
    this.thead = $('thead', container);
    this.thead.onclick = e => {
      const th = e.target.closest('th');
      if (!th) return;
      const c = this.columns[+th.dataset.i];
      if (this.sortKey === c) this.sortDir *= -1; else { this.sortKey = c; this.sortDir = 1; }
      $$('.arrow', this.thead).forEach(a => a.textContent = '');
      $('.arrow', th).textContent = this.sortDir > 0 ? '▲' : '▼';
      this.render();
    };
    this.tbody.onclick = e => {
      const tr = e.target.closest('tr[data-i]');
      if (!tr) return;
      $$('tr.selected', this.tbody).forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      this.selected = this.view[+tr.dataset.i];
      if (this.onSelect) this.onSelect(this.selected);
    };
    this.tbody.ondblclick = e => {
      const tr = e.target.closest('tr[data-i]');
      if (tr && this.onDblClick) this.onDblClick(this.view[+tr.dataset.i]);
    };
  }
  cellValue(c, r) { return c.value ? c.value(r) : r[c.key]; }
  setRows(rows) {
    const k = this.rowKey, prev = this.selected;
    this.rows = rows || [];
    this.selected = k && prev ? this.rows.find(r => r[k] === prev[k]) || null : null;
    this.render();
  }
  setFilter(fn) { this.filterFn = fn; this.render(); }
  clearSelection() { this.selected = null; $$('tr.selected', this.tbody).forEach(x => x.classList.remove('selected')); }
  render() {
    let v = this.filterFn ? this.rows.filter(this.filterFn) : [...this.rows];
    if (this.sortKey) {
      const c = this.sortKey, d = this.sortDir;
      v.sort((a, b) => {
        const x = this.cellValue(c, a), y = this.cellValue(c, b);
        const nx = parseFloat(x), ny = parseFloat(y);
        if (c.num || (!isNaN(nx) && !isNaN(ny) && String(nx) === String(x).trim() && String(ny) === String(y).trim()))
          return (num(x) - num(y)) * d;
        return String(x ?? '').localeCompare(String(y ?? ''), undefined, { numeric: true }) * d;
      });
    }
    this.view = v;
    if (!v.length) {
      this.tbody.innerHTML = `<tr><td colspan="${this.columns.length}" class="empty">${esc(this.emptyText)}</td></tr>`;
    } else {
      this.tbody.innerHTML = v.map((r, i) => `<tr data-i="${i}" class="${this.rowClass ? this.rowClass(r) : ''} ${r === this.selected ? 'selected' : ''}">${
        this.columns.map(c => `<td class="${c.num ? 'num' : ''}" title="${esc(this.cellValue(c, r))}">${c.render ? c.render(r) : esc(this.cellValue(c, r))}</td>`).join('')}</tr>`).join('');
    }
    if (this.onRender) this.onRender(v);
  }
}

/* Standard search toolbar wired to a DataTable */
function searchBar(container, table, { options, placeholder = 'Search…', extra = '' }) {
  container.innerHTML = `
    <select class="s-by">${options.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join('')}</select>
    <input type="search" class="s-q" placeholder="${esc(placeholder)}">
    <button class="btn ghost sm s-all">Show All</button>
    ${extra}
    <span class="count"></span>`;
  const by = $('.s-by', container), q = $('.s-q', container);
  const apply = () => {
    const term = q.value.trim().toLowerCase();
    const key = by.value;
    table.setFilter(!term ? null : r => {
      const keys = key === '*' ? Object.keys(r) : [key];
      return keys.some(k => String(r[k] ?? '').toLowerCase().includes(term));
    });
  };
  q.oninput = apply;
  by.onchange = apply;
  $('.s-all', container).onclick = () => { q.value = ''; by.selectedIndex = 0; table.setFilter(null); };
  table.onRender = v => { $('.count', container).textContent = `${v.length} of ${table.rows.length} records`; };
  return { apply };
}

<script>/* ===== data layer ===== */
/* ==========================================================================
   Standalone data layer - replaces the Python server (app.py).
   Talks to Firebase Realtime Database over its REST API (exactly like
   productivity.py already does with requests.get(...)), and to Firestore
   over REST for barcodes. Everything runs inside this one HTML file.
   ========================================================================== */
'use strict';

/* Browsers can block localStorage/sessionStorage for files opened from disk.
   Fall back to memory so the app still works (login then lasts until the tab closes). */
function safeStorage(kind) {
  const mem = {};
  const fallback = {
    getItem: k => (k in mem ? mem[k] : null),
    setItem: (k, v) => { mem[k] = String(v); },
    removeItem: k => { delete mem[k]; },
  };
  try {
    const s = window[kind];
    const t = '__af_test__';
    s.setItem(t, '1');
    s.removeItem(t);
    return s;
  } catch (e) {
    return fallback;
  }
}
const SS = safeStorage('sessionStorage');
const LS = safeStorage('localStorage');

const CONFIG = {
  /* ---- EDIT HERE if your database changes ---- */
  DB_URL: 'https://inventory-59b72-default-rtdb.asia-southeast1.firebasedatabase.app',
  FIRESTORE_PROJECT: 'inventory-59b72',
  /* Optional: database secret / ID token if you lock your rules (appended as ?auth=) */
  AUTH_TOKEN: '',
  /* Demo with local sample data: use the link on the login page, or open the file with ?demo */
  DEMO: /[?&]demo\b/.test(location.search) || SS.getItem('af_demo') === '1',
};

/* ---------------------------------------------------------------- helpers */
function asDict(d) {
  if (d == null) return {};
  if (Array.isArray(d)) { const o = {}; d.forEach((v, i) => { if (v != null) o[String(i)] = v; }); return o; }
  return typeof d === 'object' ? d : {};
}
const toF = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const pad2 = n => String(n).padStart(2, '0');
function nowStr(d = new Date()) {
  return `${isoDate(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
class ApiError extends Error {
  constructor(msg, status = 400, extra = {}) { super(msg); this.status = status; this.data = Object.assign({ error: msg }, extra); }
}
const SAFE_KEY = /^[^./#$\[\]]+$/;
function checkKey(k, label = 'ID') {
  k = String(k ?? '').trim();
  if (!k || !SAFE_KEY.test(k)) throw new ApiError(`${label} must not be empty or contain . / # $ [ ]`);
  return k;
}
function validDate(s, label) {
  if (s && !/^\d{4}-\d{2}-\d{2}$/.test(s)) throw new ApiError(`${label} format should be YYYY-MM-DD`);
}
function pushKey() {
  const chars = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
  let ms = Date.now(), s = '';
  for (let i = 0; i < 8; i++) { s = chars[ms % 64] + s; ms = Math.floor(ms / 64); }
  for (let i = 0; i < 12; i++) s += chars[Math.floor(Math.random() * 64)];
  return s;
}

/* ---------------------------------------------------------------- stores */
const FirebaseREST = {
  url(path) {
    const p = String(path).replace(/^\/+|\/+$/g, '').split('/').map(encodeURIComponent).join('/');
    return `${CONFIG.DB_URL}/${p}.json${CONFIG.AUTH_TOKEN ? `?auth=${encodeURIComponent(CONFIG.AUTH_TOKEN)}` : ''}`;
  },
  async req(method, path, body) {
    let res;
    try {
      res = await fetch(this.url(path), { method, body: body === undefined ? undefined : JSON.stringify(body) });
    } catch (e) {
      throw new ApiError('Cannot reach Firebase. Check your internet connection.', 503);
    }
    const j = await res.json().catch(() => null);
    if (!res.ok) {
      const msg = (j && j.error) || res.statusText;
      if (res.status === 401 || /permission/i.test(msg))
        throw new ApiError('Firebase refused access (Permission denied). Your database rules do not allow this page to read/write - see the note at the top of this file.', 403);
      throw new ApiError(`Firebase error: ${msg}`, res.status);
    }
    return j;
  },
  get(p) { return this.req('GET', p); },
  set(p, v) { return this.req('PUT', p, v); },
  update(p, v) { return this.req('PATCH', p, v); },
  delete(p) { return this.req('DELETE', p); },
  async push(p, v) { return (await this.req('POST', p, v)).name; },

  /* ---- Firestore (barcode "products" collection) via REST ---- */
  fsBase() { return `https://firestore.googleapis.com/v1/projects/${CONFIG.FIRESTORE_PROJECT}/databases/(default)/documents`; },
  toFs(v) {
    if (v === null || v === undefined) return { nullValue: null };
    if (typeof v === 'boolean') return { booleanValue: v };
    if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    if (v instanceof Date) return { timestampValue: v.toISOString() };
    return { stringValue: String(v) };
  },
  fromFs(v) {
    if ('stringValue' in v) return v.stringValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('doubleValue' in v) return v.doubleValue;
    if ('timestampValue' in v) return nowStr(new Date(v.timestampValue));
    if ('nullValue' in v) return null;
    if ('mapValue' in v) { const o = {}; Object.entries(v.mapValue.fields || {}).forEach(([k, x]) => o[k] = this.fromFs(x)); return o; }
    return '';
  },
  async barcodeSet(id, data) {
    data = Object.assign({}, data, { timestamp: new Date() });
    const fields = {};
    Object.entries(data).forEach(([k, v]) => fields[k] = this.toFs(v));
    const mask = Object.keys(fields).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
    const res = await fetch(`${this.fsBase()}/products/${encodeURIComponent(id)}?${mask}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }),
    }).catch(() => null);
    if (!res || !res.ok) {
      const j = res ? await res.json().catch(() => ({})) : {};
      throw new ApiError(`Barcode image is fine, but saving to Firestore failed: ${j.error?.message || 'network error'}`);
    }
  },
  async barcodeList() {
    const out = {};
    let token = '';
    do {
      const res = await fetch(`${this.fsBase()}/products?pageSize=300${token ? `&pageToken=${token}` : ''}`);
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error?.message || res.statusText);
      (j.documents || []).forEach(d => {
        const item = {};
        Object.entries(d.fields || {}).forEach(([k, v]) => item[k] = this.fromFs(v));
        if (item.has_barcode) out[d.name.split('/').pop()] = item;
      });
      token = j.nextPageToken || '';
    } while (token);
    return out;
  },
};

const LocalDemo = {
  KEY: 'apparelflow_demo_db',
  load() {
    if (!this.data) {
      try { this.data = JSON.parse(LS.getItem(this.KEY)); } catch (e) { this.data = null; }
      if (!this.data) { this.data = buildDemoSeed(); this.save(); }
    }
    return this.data;
  },
  save() { try { LS.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { /* in-memory only */ } },
  parts: p => String(p).split('/').filter(Boolean),
  async get(p) {
    let n = this.load();
    for (const k of this.parts(p)) { if (!n || typeof n !== 'object' || !(k in n)) return null; n = n[k]; }
    return JSON.parse(JSON.stringify(n));
  },
  async set(p, v) {
    const ps = this.parts(p); let n = this.load();
    ps.slice(0, -1).forEach(k => { n = n[k] = (n[k] && typeof n[k] === 'object') ? n[k] : {}; });
    n[ps.at(-1)] = JSON.parse(JSON.stringify(v)); this.save();
  },
  async update(p, v) {
    let n = this.load();
    this.parts(p).forEach(k => { n = n[k] = (n[k] && typeof n[k] === 'object') ? n[k] : {}; });
    Object.assign(n, JSON.parse(JSON.stringify(v))); this.save();
  },
  async delete(p) {
    const ps = this.parts(p); let n = this.load();
    for (const k of ps.slice(0, -1)) { n = n?.[k]; }
    if (n && typeof n === 'object') delete n[ps.at(-1)];
    this.save();
  },
  async push(p, v) { const k = pushKey(); await this.set(`${p}/${k}`, v); return k; },
  async barcodeSet(id, data) {
    const fs = (this.load().__firestore__ ||= { products: {} });
    fs.products[id] = Object.assign(fs.products[id] || {}, data, { timestamp: nowStr() });
    this.save();
  },
  async barcodeList() {
    const p = this.load().__firestore__?.products || {};
    return Object.fromEntries(Object.entries(p).filter(([, v]) => v.has_barcode));
  },
};

const store = CONFIG.DEMO ? LocalDemo : FirebaseREST;
const fetchMany = (...paths) => Promise.all(paths.map(p => store.get(p))).then(r => r.map(asDict));

/* ---------------------------------------------------------------- constants (from app.py) */

const MATERIAL_CONSUMPTION_RATIOS = {

};

const ACCESSORIES = ['needles', 'threads', 'twill_tape', 'zippers', 'elastic'];
const UNITS = ['meters', 'kilograms', 'pieces', 'packets', 'yards', 'rolls', 'boxes', 'liters'];
const LOCATIONS = ['Main Warehouse', 'Cutting Section', 'Dyeing Section', 'Finishing Section', 'Quality Control', 'Packing Area'];

const PRODUCT_COLS = ['invoice', 'name', 'category', 'supplier', 'contact', 'product_category', 'quantity', 'needles_used', 'threads_used', 'twill_tape_used', 'zippers_used', 'elastic_used', 'damaged'];

const slugify = t => String(t ?? '').trim().toLowerCase().replace(/[ -]/g, '_');
function ratioKey(text, keys) { const n = norm(text); return keys.find(k => norm(k) === n) || slugify(text); }

/* ---------------------------------------------------------------- session */
const Session = {
  get() { try { return JSON.parse(SS.getItem('af_user')); } catch (e) { return null; } },

  clear() { SS.removeItem('af_user'); },

function requireUser(module) {
  const u = Session.get();
  if (!u) throw new ApiError('Please login first', 401);
  if (module && !PERMS[module].includes(u.role)) throw new ApiError("You don't have permission to access this portal", 403);

/* ---------------------------------------------------------------- business logic */
async function updateProductPerformance(name, qty, damaged) {
  const d = new Date();
  const base = `product_performance/${isoDate(d)}/${String(name).replace(/[.#$\[\]\/]/g, '_') || 'Unnamed'}`;
  const node = (await store.get(base)) || {};
  node.total_produced = node.total_produced || 0;
  node.total_damaged = node.total_damaged || 0;
  node.hourly_data = node.hourly_data || {};
  const h = node.hourly_data[`${pad2(d.getHours())}:00`] ||= { produced: 0, damaged: 0 };
  const q = parseInt(qty, 10) || 0;
  node.total_produced += q; h.produced += q;
  if (damaged) { node.total_damaged += q; h.damaged += q; }
  await store.set(base, node);
}

async function consumeMaterials(productName, rawMaterial, productCategory, quantity) {
  const rawKey = ratioKey(rawMaterial, Object.keys(MATERIAL_CONSUMPTION_RATIOS));
  const catKey = ratioKey(productCategory, [...Object.keys(CATEGORY_MAPPING), ...PRODUCT_TYPES]);
  const mapped = CATEGORY_MAPPING[catKey] || catKey;
  const qty = parseInt(quantity, 10);
  const mats = asDict(await store.get('raw_materials'));
  const byName = {};
  Object.entries(mats).forEach(([code, m]) => { if (m && typeof m === 'object') { const k = norm(m.material_name); if (!(k in byName)) byName[k] = [code, m]; } });
  const messages = [], accessory = {};
  let success = 0;
  const deduct = async (nameKey, per, type) => {
    const total = per * qty;
    const hit = byName[norm(nameKey)];
    if (!hit) { messages.push(`Raw material '${nameKey}' not found in inventory`); return false; }
    const [code, m] = hit;
    const ns = toF(m.current_stock) - total;
    if (ns < 0) { messages.push(`Not enough ${m.material_name || ''} stock. Need ${Math.abs(ns).toFixed(2)} more units.`); return false; }
    await store.update(`raw_materials/${code}`, { current_stock: Math.round(ns * 100) / 100, last_updated: nowStr() });
    await store.push('material_consumption', {
      material_code: code, material_name: m.material_name || '', material_type: type, product_name: productName,
      product_category: catKey, mapped_category: mapped, quantity_used: Math.round(total * 1000) / 1000,
      pieces_produced: qty, consumption_per_piece: Math.round(per * 1000) / 1000, timestamp: nowStr(),
    });
    return true;
  };
  if (MATERIAL_CONSUMPTION_RATIOS[rawKey]?.[mapped] !== undefined)
    if (await deduct(rawKey, MATERIAL_CONSUMPTION_RATIOS[rawKey][mapped], 'fabric')) success++;
  for (const acc of ACCESSORIES) {
    const per = ACCESSORY_CONSUMPTION_RATIOS[acc][mapped];
    if (per === undefined) continue;
    if (per > 0) {
      accessory[`${acc}_used`] = Math.round(per * qty * 1000) / 1000;
      if (await deduct(acc, per, 'accessory')) success++;
    } else accessory[`${acc}_used`] = 0;
  }
  return { success, accessory, messages };
}

function productPayload(d) {
  for (const [f, l] of [['invoice', 'Product ID'], ['name', 'Product Name'], ['category', 'Size'], ['supplier', 'Customer Name'], ['contact', 'Raw Material'], ['quantity', 'Quantity']])
    if (!String(d[f] ?? '').trim()) throw new ApiError(`${l} is required`);
  const invoice = Number(String(d.invoice).trim());
  if (!Number.isInteger(invoice)) throw new ApiError('Product ID must be a number');
  const qty = Number(String(d.quantity).trim());
  if (!Number.isInteger(qty) || qty <= 0) throw new ApiError('Quantity must be a positive whole number');
  return { invoice, qty };
}
function productRecord(d, invoice, qty, calc) {
  const rec = {
    invoice, name: String(d.name).trim(), category: d.category, supplier: String(d.supplier).trim(), contact: d.contact,
    product_category: d.product_category || '', quantity: String(qty), damaged: !!d.damaged,
  };
  ACCESSORIES.forEach(a => { const v = toF(d[`${a}_used`]); rec[`${a}_used`] = v || calc[`${a}_used`] || 0; });
  return rec;
}

function validatePhone(phone) {
  let p = String(phone || '').replace(/\D/g, '');
  if (p.length < 10 || p.length > 15) throw new ApiError('Invalid phone number: should be 10-15 digits');
  if (!p.startsWith('94') && p.length === 10) p = p.startsWith('0') ? '94' + p.slice(1) : '94' + p;
  return p;
}
function materialPayload(d) {
  for (const k of ['material_name', 'category', 'unit_measure', 'current_stock', 'min_stock', 'location', 'supplier'])
    if (!String(d[k] ?? '').trim()) throw new ApiError('All required fields must be filled');
  const cur = parseFloat(d.current_stock), mn = parseFloat(d.min_stock);
  if (!Number.isFinite(cur) || !Number.isFinite(mn)) throw new ApiError('Invalid stock quantity');
  if (cur < 0 || mn < 0) throw new ApiError('Stock quantities cannot be negative');
  const phone = String(d.phone_number || '').trim();
  return {
    material_name: String(d.material_name).trim(), category: d.category, unit_measure: d.unit_measure,
    current_stock: cur, min_stock_alert: mn, location: d.location, supplier: d.supplier,
    phone_number: phone ? validatePhone(phone) : '',
  };
}
function supplierPayload(d) {
  const o = {};
  SUP_FIELDS.forEach(k => o[k] = String(d[k] ?? '').trim());
  if (!['name', 'category', 'supplier', 'contact', 'description', 'order_date'].every(k => o[k])) throw new ApiError('All fields except Received Date are required');
  validDate(o.order_date, 'Order date'); validDate(o.received_date, 'Received date');
  return o;
}
function empPayload(d) {
  const o = {};
  EMP_FIELDS.forEach(f => o[f] = String(d[f] ?? '').trim());
  if (!EMP_FIELDS.filter(f => f !== 'rfid').every(f => o[f])) throw new ApiError('All fields are required');
  return o;
}

/* Top 10 employees by pieces (productivity records), for Today / This Month / All Time */
function topEmployees(emps, flat, nested) {
  const names = {};
  Object.entries(emps).forEach(([k, v]) => { if (v && typeof v === 'object') names[k] = v.name || k; });
  const rows = [];
  Object.values(flat).forEach(r => { if (r && typeof r === 'object') rows.push([r.employeeId || '', r.employeeName || '', String(r.date || '').slice(0, 10), toF(r.pieces)]); });
  Object.entries(nested).forEach(([eid, byDate]) => Object.entries(asDict(byDate)).forEach(([date, recs]) =>
    Object.values(asDict(recs)).forEach(r => { if (r && typeof r === 'object') rows.push([r.employeeId || eid, r.employeeName || '', String(r.date || date).slice(0, 10), toF(r.pieces)]); })));
  const t = today(), m = t.slice(0, 7);
  const top = test => {
    const agg = {};
    rows.forEach(([id, name, date, pcs]) => {
      if (!test(date)) return;
      const key = id || name || 'Unknown';
      const a = agg[key] ||= { id, name: names[id] || name || id || 'Unknown', pieces: 0 };
      a.pieces += pcs;
    });
    return Object.values(agg).filter(a => a.pieces > 0).sort((a, b) => b.pieces - a.pieces).slice(0, 10);
  };
  return { today: top(d => d === t), month: top(d => d.startsWith(m)), all: top(() => true) };
}

  const agg = {};
  Object.values(sup).forEach(s => {
    if (!s || typeof s !== 'object') return;

    const od = parseAnyDate(s.order_date), rd = parseAnyDate(s.received_date);
    if (od && rd && /^\d{4}-/.test(s.order_date) && /^\d{4}-/.test(s.received_date)) { a[0] += Math.round((rd - od) / 86400000); a[1]++; }

function allocatedByMaterial(batches) {
  const out = {};
  Object.values(asDict(batches)).forEach(b => {
    if (!b || typeof b !== 'object') return;
    Object.entries(asDict(b.material_allocations)).forEach(([n, a]) => { out[n] = (out[n] || 0) + toF(a?.allocated_quantity); });
  });
  return out;
}
defRoute('GET', '/api/materials', async () => {
  requireUser();
  const [mats, batches] = await fetchMany('raw_materials', 'production_batches');
  const alloc = allocatedByMaterial(batches);
  const r2 = v => Math.round(v * 100) / 100;
  const rows = Object.entries(mats).filter(([, m]) => m && typeof m === 'object').map(([code, m]) => {
    const cur = toF(m.current_stock), mn = toF(m.min_stock_alert ?? m.min_stock_level), al = alloc[m.material_name || ''] || 0;
    let status = cur <= mn ? 'Low Stock' : 'In Stock';
    if (al > 0) status += ` (Allocated: ${al.toFixed(2)})`;
    let display = code;
    if (code.startsWith('AUTO_')) { const n = parseInt(code.split('_')[1], 10); if (Number.isFinite(n)) display = String(n); }
    return {
      code, display_code: display, material_name: m.material_name || '', category: m.category || '',
      unit_measure: m.unit_measure || m.unit || '', current_stock: r2(cur), allocated: r2(al), available: r2(cur - al),
      min_stock: r2(mn), status, low: cur <= mn, location: m.location || '', supplier: m.supplier || '',
      phone_number: m.phone_number || '', material_type: m.material_type || '',
    };
  });
  return { rows, units: UNITS, locations: LOCATIONS, product_types: PRODUCT_TYPES, fabric_ratios: MATERIAL_CONSUMPTION_RATIOS };
});

defRoute('PUT', '/api/products/:key', async (m, d) => {
  requireUser('products');
  const key = checkKey(decodeURIComponent(m.key));
  const { invoice, qty } = productPayload(d);
  const old = await store.get(`product_data/${key}`);
  if (!old) throw new ApiError('Product not found', 404);
  if (Object.entries(asDict(await store.get('product_data'))).some(([k, p]) => k !== key && p && String(p.invoice) === String(invoice)))
    throw new ApiError('Another product already uses this Product ID');
  const oldQty = Math.trunc(toF(old.quantity)), diff = qty - oldQty;
  let calc = {}, msgs = [];
  if (diff !== 0) {
    const r = await consumeMaterials(d.name, d.contact, d.product_category, diff);
    if (!r.success) throw new ApiError('No material consumption data found for this product category' + (r.messages.length ? ': ' + r.messages.join('; ') : ''));
    calc = r.accessory; msgs = r.messages;
  }
  const rec = productRecord(d, invoice, qty, calc);
  ['price', 'description'].forEach(x => { if (x in old) rec[x] = old[x]; });
  await store.set(`product_data/${key}`, rec);
  if (old.name !== rec.name || oldQty !== qty || !!old.damaged !== rec.damaged) {
    if (old.name !== rec.name) await updateProductPerformance(old.name || '', -oldQty, !!old.damaged);
    await updateProductPerformance(rec.name, qty, rec.damaged);
  }
  return { message: 'Product updated successfully', warnings: msgs };
});

/* ---- productivity / attendance ---- */
/* Productivity page saves timeInterval like "1 - 8:00 AM - 9:00 AM"; older records save hour: 9.
   Returns {hour, label, order} so both show in one "Hour / Interval" column and sort by start time. */
function slotInfo(r) {
  const interval = String(r.timeInterval || '').trim();
  if (interval) {
    const m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(interval);
    let mins = null;
    if (m) {
      let h = parseInt(m[1], 10) % 12;
      if (m[3].toUpperCase() === 'PM') h += 12;
      mins = h * 60 + parseInt(m[2], 10);
    }
    const label = interval.replace(/^\s*\d+\s*-\s*/, '');      // drop the "1 - " slot number
    return { hour: mins == null ? 0 : Math.floor(mins / 60), label, order: mins == null ? 0 : mins };
  }
  const h = Math.trunc(toF(r.hour));
  return { hour: h, label: `${String(h).padStart(2, '0')}:00`, order: h * 60 };
}

/* ---- job file: operation schedule per Job Number + Item ---- */
const MACHINE_TYPES = [
  'Single Needle Lockstitch (SNLS)', 'Double Needle Lockstitch (DNLS)', 'Overlock 3 Thread',
  'Overlock 4 Thread', 'Overlock 5 Thread (Safety Stitch)', 'Flatlock / Coverstitch', 'Feed-off-the-Arm',
  'Kansai (Multi-Needle)', 'Zigzag', 'Bartack', 'Buttonhole', 'Button Attach', 'Snap / Rivet Machine',
  'Label Attach', 'Fusing Machine', 'Iron / Steam Press', 'Cutting Machine', 'Thread Trimming', 'Manual / Hand Work',
];
function jobOperations(raw) {
  return Object.entries(asDict(raw))
    .filter(([, o]) => o && typeof o === 'object')
    .sort((a, b) => (toF(a[1].seq) - toF(b[1].seq)) || (parseInt(a[0], 10) - parseInt(b[0], 10)))
    .map(([, o]) => ({ operation_name: o.operation_name || '', machine_type: o.machine_type || '', smv: o.smv ?? '', notes: o.notes || '' }));
}
async function jobPayload(d, key = null) {
  const job = String(d.job_number || '').trim(), item = String(d.item_name || '').trim();
  if (!job) throw new ApiError('Job Number is required');
  if (!item) throw new ApiError('Item Name is required');
  if (!Array.isArray(d.operations)) throw new ApiError('Invalid operation schedule');
  const ops = d.operations.map((o, idx) => {
    const i = idx + 1;
    const name = String(o.operation_name || '').trim(), machine = String(o.machine_type || '').trim();
    if (!name) throw new ApiError(`Operation ${i}: operation name is required`);
    if (!machine) throw new ApiError(`Operation ${i} (${name}): machine type is required`);
    const rec = { seq: i, operation_name: name, machine_type: machine };
    const smv = String(o.smv ?? '').trim();
    if (smv) {
      const v = parseFloat(smv);
      if (!Number.isFinite(v) || v < 0) throw new ApiError(`Operation ${i} (${name}): SMV must be a positive number`);
      rec.smv = Math.round(v * 1000) / 1000;
    }
    const notes = String(o.notes || '').trim();
    if (notes) rec.notes = notes;
    return rec;
  });
  if (!ops.length) throw new ApiError('Add at least one operation to the schedule');
  const all = asDict(await store.get('job_files'));
  for (const [k, j] of Object.entries(all)) {
    if (k !== key && j && String(j.job_number || '').trim().toLowerCase() === job.toLowerCase()
        && String(j.item_name || '').trim().toLowerCase() === item.toLowerCase())
      throw new ApiError(`A job file for ${job} / ${item} already exists - select it in the list to edit it`);
  }
  return { job_number: job, item_name: item, notes: String(d.notes || '').trim(), operations: ops };
}
defRoute('GET', '/api/jobfiles', async () => {
  requireUser('jobfile');
  const [jobs, prods] = await fetchMany('job_files', 'product_data');
  const opNames = new Set(), machines = new Set(MACHINE_TYPES);
  const rows = Object.entries(jobs).filter(([, j]) => j && typeof j === 'object').map(([k, j]) => {
    const ops = jobOperations(j.operations);
    ops.forEach(o => { if (o.operation_name) opNames.add(o.operation_name); if (o.machine_type) machines.add(o.machine_type); });
    return {
      key: k, job_number: j.job_number || '', item_name: j.item_name || '', notes: j.notes || '', operations: ops,
      op_count: ops.length, total_smv: Math.round(ops.reduce((a, o) => a + toF(o.smv), 0) * 1000) / 1000,
      machines: [...new Set(ops.map(o => o.machine_type).filter(Boolean))].sort(),
      created_at: j.created_at || '', updated_at: j.updated_at || '',
    };
  });
  rows.sort((a, b) => String(a.job_number).localeCompare(String(b.job_number), undefined, { numeric: true, sensitivity: 'base' })
    || String(a.item_name).localeCompare(String(b.item_name), undefined, { sensitivity: 'base' }));
  const items = new Set([...Object.values(prods).filter(p => p && typeof p === 'object').map(p => p.name), ...rows.map(r => r.item_name)].filter(Boolean));
  const sortCI = arr => [...arr].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  return { rows, items: sortCI(items), operation_names: sortCI(opNames), machine_types: sortCI(machines) };
});

/* ---------------------------------------------------------------- api() replacement */
async function api(method, url, data) {
  const path = url.split('?')[0];
  for (const r of ROUTES) {
    if (r.method !== method) continue;
    const m = r.re.exec(url) || r.re.exec(path);
    if (!m) continue;
    const params = Object.assign({ _url: url }, m.groups || {});
    try {
      const res = await r.fn(params, data || {});
      return Object.assign({ ok: true }, res);
    } catch (e) {
      if (e instanceof ApiError) {
        if (e.status === 401 && !url.endsWith('/login')) showLogin();
        const err = new Error(e.message); err.status = e.status; err.data = e.data; throw err;
      }
      console.error(e);
      throw new Error(`Error: ${e.message}`);
    }
  }
  throw new Error(`Unknown action: ${method} ${path}`);
}

<script>/* ===== invoice ===== */
/* Single-file extras: printable invoice (replaces the ReportLab PDF) */

function openInvoice(sale) {
